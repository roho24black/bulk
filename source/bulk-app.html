<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Бульк</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#eafaf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Бульк">
<style>
  :root{
    --bg1:#eafaf6; --bg2:#d6f5ec; --body1:#8fe8cf; --body2:#3fc9a4; --ink:#2c3a36;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",sans-serif;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--ink);
    transition:background 0.8s ease, color 0.8s ease;
  }
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }

  /* ambient background life — soft drifting blobs + clouds so the scene never sits dead still */
  #ambient{position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;}
  #ambient span{
    position:absolute; border-radius:50%; background:var(--body2); opacity:0.16; filter:blur(2px);
    animation:drift 14s ease-in-out infinite;
  }
  #ambient span:nth-child(1){width:90px; height:90px; left:8%; top:14%; animation-duration:16s;}
  #ambient span:nth-child(2){width:50px; height:50px; right:12%; top:22%; animation-duration:12s; animation-delay:-3s;}
  #ambient span:nth-child(3){width:70px; height:70px; left:14%; bottom:20%; animation-duration:18s; animation-delay:-7s;}
  #ambient span:nth-child(4){width:40px; height:40px; right:16%; bottom:28%; animation-duration:11s; animation-delay:-5s;}
  #ambient span:nth-child(5){width:110px; height:110px; right:-30px; top:50%; animation-duration:20s; animation-delay:-9s;}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(14px,-18px) scale(1.12);}}

  #ambient .cloud{
    position:absolute; border-radius:50%; background:white; opacity:0.5; filter:blur(1px);
    animation:cloudDrift 30s linear infinite;
  }
  #ambient .cloud.c1{width:80px; height:26px; top:9%; left:-100px; animation-duration:26s;}
  #ambient .cloud.c2{width:56px; height:20px; top:16%; left:-100px; animation-duration:34s; animation-delay:-14s; opacity:0.35;}
  @keyframes cloudDrift{from{transform:translateX(0);}to{transform:translateX(calc(100vw + 160px));}}

  #ground{
    position:fixed; left:-10%; right:-10%; bottom:0; height:34vh; z-index:0; pointer-events:none;
    background:var(--body2); opacity:0.16;
    border-radius:50% 50% 0 0 / 70px 70px 0 0;
    transition:background 0.8s ease;
  }

  #header{
    position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    text-align:center; font-size:13px; font-weight:800; letter-spacing:0.16em;
    opacity:0.45; z-index:5; background:none; border:none; color:inherit; font-family:inherit;
    padding:6px 12px; cursor:pointer;
  }
  #header:active{opacity:0.7;}

  #rosterStrip{
    position:fixed; top:calc(48px + env(safe-area-inset-top)); left:0; right:0;
    display:none; justify-content:center; align-items:center; gap:9px; z-index:4; padding:0 16px;
  }
  .roster-dot{
    width:30px; height:30px; border-radius:50%; border:2px solid transparent; padding:0;
    cursor:pointer; flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,0.15); transition:transform 0.15s;
  }
  .roster-dot.active{border-color:var(--ink); transform:scale(1.15);}
  .roster-add{
    width:28px; height:28px; border-radius:50%; border:2px dashed rgba(0,0,0,0.3); background:none;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700;
    color:var(--ink); opacity:0.5; cursor:pointer; flex-shrink:0;
  }

  /* ---------- HATCH SCREEN ---------- */
  #hatch{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:28px; text-align:center; padding:24px;
    background:linear-gradient(180deg,var(--bg1),var(--bg2)); transition:background 0.8s ease; z-index:20;
  }
  #hatch.hidden{display:none;}
  #hatch h1{font-size:22px; margin:0; font-weight:700;}
  #hatch p{font-size:15px; opacity:0.7; margin:0; max-width:260px; line-height:1.4;}
  #egg{
    width:140px; height:170px; cursor:pointer;
    filter:drop-shadow(0 12px 20px rgba(0,0,0,0.12));
    animation:eggIdle 2.6s ease-in-out infinite;
  }
  @keyframes eggIdle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  #egg.cracking{animation:eggShake 0.5s ease-in-out 3;}
  @keyframes eggShake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-6px) rotate(-4deg)}75%{transform:translateX(6px) rotate(4deg)}}
  #hatchReveal{display:none; flex-direction:column; align-items:center; gap:18px;}
  #hatchReveal.show{display:flex;}
  #hatchCreatureWrap{width:200px; height:220px;}
  #hatchName{font-size:19px; font-weight:700;}
  #hatchBtn{
    margin-top:6px; border:none; border-radius:999px; padding:14px 32px;
    background:var(--body2); color:white; font-size:16px; font-weight:600;
    box-shadow:0 6px 16px rgba(0,0,0,0.15);
  }

  /* ---------- OVERLAYS (shared look) ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,20,25,0.4); z-index:30;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.2s;
  }
  .overlay.show{opacity:1; pointer-events:auto;}

  .confirm-card{
    background:white; color:#2c3a36; border-radius:22px; padding:26px 22px;
    max-width:280px; text-align:center; box-shadow:0 24px 48px rgba(0,0,0,0.25);
    transform:scale(0.92); transition:transform 0.2s;
  }
  .overlay.show .confirm-card{transform:scale(1);}
  .confirm-card p{margin:0 0 18px; font-size:15px; line-height:1.4; font-weight:600;}
  .confirm-actions{display:flex; gap:10px; justify-content:center;}
  .confirm-btn{border:none; border-radius:999px; padding:11px 18px; font-size:14px; font-weight:700; cursor:pointer;}
  .confirm-btn.secondary{background:#eef1f0; color:#2c3a36;}
  .confirm-btn.primary{background:#3fc9a4; color:white;}

  /* ---------- HEADER MENU ---------- */
  .menu-card{
    background:white; color:#2c3a36; border-radius:22px; padding:10px; width:260px;
    box-shadow:0 24px 48px rgba(0,0,0,0.25);
    transform:scale(0.92); transition:transform 0.2s;
  }
  .overlay.show .menu-card{transform:scale(1);}
  .menu-row{
    display:flex; align-items:center; gap:10px; width:100%; padding:13px 12px;
    background:none; border:none; font-size:15px; font-weight:600; color:#2c3a36;
    text-align:left; border-radius:12px; cursor:pointer; font-family:inherit;
  }
  .menu-row:active{background:#f0f3f2;}
  .menu-sep{height:1px; background:#eef1f0; margin:4px 8px;}
  .menu-cancel{
    margin-top:4px; width:100%; padding:12px; background:#f5f5f5; border:none;
    border-radius:12px; font-weight:700; font-size:14px; color:#2c3a36; cursor:pointer; font-family:inherit;
  }

  /* ---------- COLLECTION ---------- */
  #collectionOverlay{align-items:flex-end;}
  .collection-panel{
    background:white; color:#2c3a36; width:100%; max-width:420px; border-radius:24px 24px 0 0;
    padding:20px; max-height:72vh; display:flex; flex-direction:column;
    transform:translateY(24px); transition:transform 0.2s;
  }
  #collectionOverlay.show .collection-panel{transform:translateY(0);}
  .collection-header{display:flex; align-items:center; justify-content:space-between; font-weight:800; font-size:16px; margin-bottom:14px;}
  #collectionClose{border:none; background:#f0f3f2; width:30px; height:30px; border-radius:50%; font-size:14px; cursor:pointer; color:#2c3a36;}
  #collectionList{overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-bottom:env(safe-area-inset-bottom);}
  .collection-item{display:flex; align-items:center; gap:12px; padding:10px; border-radius:14px; background:#f7f9f8;}
  .collection-dot{width:34px; height:34px; border-radius:50%; flex-shrink:0;}
  .collection-info{display:flex; flex-direction:column;}
  .collection-name{font-weight:700; font-size:14px;}
  .collection-dates{font-size:12px; opacity:0.55;}
  .collection-empty{text-align:center; opacity:0.5; padding:30px 10px; font-size:14px; line-height:1.5;}

  /* ---------- MAIN SCREEN ---------- */
  #stage{position:relative; width:min(90vw,320px); height:280px; display:flex; align-items:center; justify-content:center; z-index:1;}
  .creature{width:100%; height:100%; overflow:visible;}

  .aura{fill:var(--body2); opacity:0.2; filter:blur(20px);}
  .creature.has-aura .aura{opacity:0.45; animation:auraPulse 3s ease-in-out infinite;}
  @keyframes auraPulse{0%,100%{opacity:0.3; r:90px;}50%{opacity:0.5; r:98px;}}

  .ground-shadow{fill:#000; opacity:0.09;}

  .ambient-twinkle polygon{animation:twinkle 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
  .ambient-twinkle polygon:nth-child(2){animation-delay:1.1s;}
  @keyframes twinkle{0%,100%{opacity:0.12; transform:scale(0.65);}50%{opacity:0.6; transform:scale(1);}}

  /* growth stage scaling, kept separate from mood/bounce animation transforms */
  #stageScale{transform-origin:100px 118px; transition:transform 0.6s ease;}
  .creature.stage-baby #stageScale{transform:scale(0.76);}
  .creature.stage-kid #stageScale{transform:scale(0.9);}
  .creature.stage-adult #stageScale{transform:scale(1);}
  .creature.grow-flash #stageScale{animation:growFlash 0.9s ease;}
  @keyframes growFlash{0%{filter:brightness(1) saturate(1);}40%{filter:brightness(1.35) saturate(1.4);}100%{filter:brightness(1) saturate(1);}}

  .body-shape{display:none; fill:url(#bodyGrad); stroke:var(--ink); stroke-width:4.5; stroke-opacity:0.8; stroke-linejoin:round;}
  .creature.species-drop .body-drop{display:block;}
  .creature.species-spike .body-spike{display:block;}
  .creature.species-cloud .body-cloud{display:block; stroke:none;}
  .creature.species-cloud .body-cloud-outline{display:block; fill:var(--ink); fill-opacity:0.8; stroke:none;}
  .creature.species-leaf .body-leaf{display:block;}
  .creature.species-flame .body-flame{display:block;}
  .creature.species-crystal .body-crystal{display:block; stroke:white; stroke-width:1.5; stroke-opacity:0.5;}
  .creature.species-blot .body-blot{display:block;}
  .creature.species-star .body-star{display:block;}
  .creature.species-rainbow .body-rainbow{display:block; fill:url(#rainbowGrad); stroke:white; stroke-width:1.5; stroke-opacity:0.5; animation:hueShift 4s linear infinite;}
  @keyframes hueShift{to{filter:hue-rotate(360deg);}}
  .gloss{fill:white; opacity:0.4;}
  .gloss-dot{fill:white; opacity:0.55;}
  .body-shadow{fill:#000; opacity:0.12;}
  .blush{fill:#ff8fa3; opacity:0.5;}
  .creature.species-crystal .gloss, .creature.species-rainbow .gloss,
  .creature.species-crystal .gloss-dot, .creature.species-rainbow .gloss-dot{display:none;}

  .deco{display:none;}
  .creature.species-blot .deco-blot{display:block;}

  .face{display:none;}
  .creature.mood-happy .face-happy{display:block;}
  .creature.mood-sad .face-sad{display:block;}
  .creature.mood-sleepy .face-sleepy{display:block;}
  .creature.mood-playful .face-playful{display:block;}
  .creature.mood-ecstatic .face-ecstatic{display:block;}
  .creature.mood-gloomy .face-gloomy{display:block;}
  .creature.mood-hungry .face-hungry{display:block;}
  .creature.mood-bored .face-bored{display:block;}
  .creature.mood-dizzy .face-dizzy{display:block;}
  .creature.mood-silly .face-silly{display:block;}
  .creature.mood-shock .face-shock{display:block;}
  .creature.mood-grumpy .face-grumpy{display:block;}
  .creature.mood-love .face-love{display:block;}

  .scar{display:none;}
  .creature.has-scar .scar{display:block;}
  .accessory{display:none;}
  .creature.has-accessory .accessory{display:block;}

  .zzz{animation:floatUp 2.4s ease-in-out infinite;}
  .zzz.z2{animation-delay:0.5s;}
  .zzz.z3{animation-delay:1s;}
  @keyframes floatUp{0%{opacity:0; transform:translateY(6px)}30%{opacity:0.8}100%{opacity:0; transform:translateY(-14px)}}

  .sparkle{animation:sparkle 1.4s ease-in-out infinite;}
  @keyframes sparkle{0%,100%{opacity:0.4; transform:scale(0.8)}50%{opacity:1; transform:scale(1.15)}}

  .spiral-eye{animation:spin 0.85s linear infinite; transform-box:fill-box; transform-origin:center;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .creature.bounce #bodyGroup{animation:bounce 0.7s ease;}
  @keyframes bounce{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-18px) scale(1.05,0.95)}55%{transform:translateY(0) scale(0.96,1.06)}100%{transform:translateY(0) scale(1,1)}}
  .creature.mood-ecstatic #bodyGroup{animation:bobble 1.1s ease-in-out infinite;}
  @keyframes bobble{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .creature.mood-sad #bodyGroup{transform:scaleY(0.92) translateY(6px);}
  .creature.mood-gloomy #bodyGroup{transform:scaleY(0.85) translateY(10px); opacity:0.75;}
  .creature.mood-bored #bodyGroup{transform:scaleY(0.95) translateY(3px);}
  .creature.mood-playful #bodyGroup{animation:tilt 1.8s ease-in-out infinite;}
  .creature.mood-dizzy #bodyGroup{animation:wobble 0.5s ease-in-out infinite;}
  @keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes wobble{0%,100%{transform:rotate(-6deg) translateX(-3px)}50%{transform:rotate(6deg) translateX(3px)}}
  .creature:not(.bounce) #bodyGroup{animation-fill-mode:both;}
  #bodyGroup{transform-origin:100px 118px; animation:idle 3.4s ease-in-out infinite;}
  @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  /* poop / mess mechanic */
  .poop{display:none; cursor:pointer;}
  .creature.has-poop .poop{display:block;}
  .poop-inner{animation:poopPop 0.35s ease;}
  @keyframes poopPop{from{transform:scale(0) rotate(-10deg);}to{transform:scale(1) rotate(0);}}
  .poop-inner.cleaning{animation:poopClean 0.3s ease forwards;}
  @keyframes poopClean{to{transform:scale(0) rotate(25deg); opacity:0;}}

  /* per-action micro effects — nested wrapper so the CSS-animated transform never clobbers
     the outer element's position-setting transform attribute (they're different elements) */
  .fx{display:none; pointer-events:none;}
  .creature.fx-play-a .fx-play-a-el{display:block;}
  .creature.fx-play-a .fx-play-a-el .fx-inner{animation:fxBall 0.9s ease forwards;}
  .creature.fx-play-b .fx-play-b-el{display:block;}
  .creature.fx-play-b .fx-play-b-el .fx-inner{animation:fxStar 0.9s ease forwards;}
  .creature.fx-pet-a .fx-pet-a-el{display:block;}
  .creature.fx-pet-a .fx-pet-a-el .fx-inner{animation:fxHearts 0.9s ease forwards;}
  .creature.fx-pet-b .fx-pet-b-el{display:block;}
  .creature.fx-pet-b .fx-pet-b-el .fx-inner{animation:fxRing 0.9s ease forwards;}
  @keyframes fxBall{0%{opacity:0; transform:translate(0,0) scale(0.6);}20%{opacity:1;}50%{transform:translate(-8px,-20px) scale(1);}75%{transform:translate(8px,-6px) scale(0.95);}100%{opacity:0; transform:translate(0,6px) scale(0.7);}}
  @keyframes fxStar{0%{opacity:0; transform:translate(-36px,4px) rotate(0) scale(0.6);}30%{opacity:1;}100%{opacity:0; transform:translate(36px,-14px) rotate(220deg) scale(1);}}
  @keyframes fxHearts{0%{opacity:0; transform:translateY(4px) scale(0.5);}30%{opacity:1;}100%{opacity:0; transform:translateY(-30px) scale(1.05);}}
  @keyframes fxRing{0%{opacity:0.9; transform:scale(0.4);}100%{opacity:0; transform:scale(2.1);}}

  /* real feeding sequence: food travels up from below to the mouth, then gets eaten */
  .feed-item{display:none;}
  .feed-item.show-item{display:block;}
  .feed-travel{opacity:0;}
  .chomp{opacity:0; fill:var(--ink);}
  .creature.feeding .feed-travel{animation:feedTravel 0.62s cubic-bezier(.2,.7,.3,1) forwards;}
  .creature.feeding .chomp{animation:chompFlash 0.62s ease-out forwards;}
  @keyframes feedTravel{
    0%{opacity:0; transform:translate(0,74px) scale(0.65);}
    18%{opacity:1;}
    68%{opacity:1; transform:translate(0,0) scale(1);}
    82%{opacity:1; transform:translate(0,-3px) scale(1.15);}
    100%{opacity:0; transform:translate(0,-3px) scale(0.15);}
  }
  @keyframes chompFlash{
    0%,52%{opacity:0; transform:scale(0.3);}
    64%{opacity:1; transform:scale(1);}
    80%{opacity:1; transform:scale(0.8);}
    100%{opacity:0; transform:scale(0.3);}
  }
  @keyframes fxRing{0%{opacity:0.9; transform:scale(0.4);}100%{opacity:0; transform:scale(2.1);}}

  .creature.fx-jackpot .fx-jackpot-el{display:block;}
  .fx-jackpot-el .confetti{opacity:0;}
  .fx-jackpot-el .c1{animation:confettiBurst1 1s ease-out forwards;}
  .fx-jackpot-el .c2{animation:confettiBurst2 1s ease-out forwards;}
  .fx-jackpot-el .c3{animation:confettiBurst3 1s ease-out forwards;}
  .fx-jackpot-el .c4{animation:confettiBurst4 1s ease-out forwards;}
  .fx-jackpot-el .c5{animation:confettiBurst5 1s ease-out forwards;}
  .fx-jackpot-el .c6{animation:confettiBurst6 1s ease-out forwards;}
  @keyframes confettiBurst1{0%{opacity:0; transform:translate(0,0) scale(0.4);}20%{opacity:1;}100%{opacity:0; transform:translate(-42px,-32px) scale(1) rotate(180deg);}}
  @keyframes confettiBurst2{0%{opacity:0; transform:translate(0,0) scale(0.4);}20%{opacity:1;}100%{opacity:0; transform:translate(2px,-48px) scale(1) rotate(-160deg);}}
  @keyframes confettiBurst3{0%{opacity:0; transform:translate(0,0) scale(0.4);}20%{opacity:1;}100%{opacity:0; transform:translate(42px,-30px) scale(1) rotate(200deg);}}
  @keyframes confettiBurst4{0%{opacity:0; transform:translate(0,0) scale(0.4);}20%{opacity:1;}100%{opacity:0; transform:translate(-36px,14px) scale(1) rotate(-140deg);}}
  @keyframes confettiBurst5{0%{opacity:0; transform:translate(0,0) scale(0.4);}20%{opacity:1;}100%{opacity:0; transform:translate(2px,30px) scale(1) rotate(160deg);}}
  @keyframes confettiBurst6{0%{opacity:0; transform:translate(0,0) scale(0.4);}20%{opacity:1;}100%{opacity:0; transform:translate(36px,14px) scale(1) rotate(-200deg);}}

  /* fixes the bounce being swallowed by looping mood animations (higher specificity) */
  .creature.bounce.stage-baby #bodyGroup, .creature.bounce.stage-kid #bodyGroup, .creature.bounce.stage-adult #bodyGroup{animation:bounce 0.7s ease;}
  #bodyGroup{cursor:pointer; touch-action:manipulation;}

  /* body-language reactions live on their own wrapper so they never fight mood/bounce animations */
  #reactGroup{transform-origin:100px 118px;}
  .creature.react-spin #reactGroup{animation:reactSpin 0.8s ease-in-out;}
  .creature.react-dodge #reactGroup{animation:reactDodge 0.75s ease-in-out;}
  .creature.react-squish #reactGroup{animation:reactSquish 0.7s ease-out;}
  .creature.react-shake #reactGroup{animation:reactShake 0.7s ease-in-out;}
  .creature.react-peek #reactGroup{animation:reactPeek 1.1s ease-in-out;}
  .creature.react-hop2 #reactGroup{animation:reactHop2 0.85s ease-out;}
  .creature.react-sway #reactGroup{animation:reactSway 1s ease-in-out;}
  @keyframes reactSpin{0%{transform:rotate(0) scale(1);}40%{transform:rotate(200deg) scale(1.12) translateY(-10px);}100%{transform:rotate(360deg) scale(1);}}
  @keyframes reactDodge{0%{transform:translateX(0);}25%{transform:translateX(-22px) rotate(-8deg);}55%{transform:translateX(22px) rotate(8deg);}80%{transform:translateX(-6px);}100%{transform:translateX(0);}}
  @keyframes reactSquish{0%{transform:scale(1,1);}30%{transform:scale(1.28,0.68) translateY(14px);}60%{transform:scale(0.88,1.18) translateY(-8px);}100%{transform:scale(1,1);}}
  @keyframes reactShake{0%,100%{transform:translateX(0) rotate(0);}15%{transform:translateX(-8px) rotate(-6deg);}30%{transform:translateX(8px) rotate(6deg);}45%{transform:translateX(-7px) rotate(-5deg);}60%{transform:translateX(7px) rotate(5deg);}80%{transform:translateX(-3px);}}
  @keyframes reactPeek{0%{transform:scale(1) translateY(0);opacity:1;}30%{transform:scale(0.18) translateY(80px);opacity:0.15;}55%{transform:scale(0.18) translateY(80px);opacity:0.15;}80%{transform:scale(1.1) translateY(-8px);opacity:1;}100%{transform:scale(1) translateY(0);opacity:1;}}
  @keyframes reactHop2{0%,100%{transform:translateY(0);}20%{transform:translateY(-24px);}40%{transform:translateY(0);}60%{transform:translateY(-14px);}80%{transform:translateY(0);}}
  @keyframes reactSway{0%,100%{transform:rotate(0);}25%{transform:rotate(-8deg);}75%{transform:rotate(8deg);}}

  .heartbeat{animation:heartbeat 0.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
  @keyframes heartbeat{0%,100%{transform:scale(1);}50%{transform:scale(1.22);}}

  /* dirt: appears when he has not been washed for a while */
  .dirt{display:none;}
  .creature.is-dirty .dirt{display:block;}
  .dirt-spot{fill:#7a5c3e; opacity:0.55;}
  .stink{animation:stinkRise 2.2s ease-in-out infinite;}
  .stink.s2{animation-delay:0.7s;}
  .stink.s3{animation-delay:1.4s;}
  @keyframes stinkRise{0%{opacity:0.15; transform:translateY(6px);}50%{opacity:0.75; transform:translateY(-4px);}100%{opacity:0.15; transform:translateY(-12px);}}

  /* wash: soap bubbles rise around him */
  .creature.fx-wash .fx-wash-el{display:block;}
  .fx-wash-el .bub{opacity:0; fill:rgba(255,255,255,0.6); stroke:#8fd3ff; stroke-width:1.6; animation:bubRise 1.5s ease-out forwards;}
  .fx-wash-el g:nth-child(2) .bub{animation-delay:0.1s;}
  .fx-wash-el g:nth-child(3) .bub{animation-delay:0.2s;}
  .fx-wash-el g:nth-child(4) .bub{animation-delay:0.05s;}
  .fx-wash-el g:nth-child(5) .bub{animation-delay:0.3s;}
  .fx-wash-el g:nth-child(6) .bub{animation-delay:0.15s;}
  .fx-wash-el g:nth-child(7) .bub{animation-delay:0.25s;}
  .fx-wash-el g:nth-child(8) .bub{animation-delay:0.35s;}
  @keyframes bubRise{0%{opacity:0; transform:translateY(24px) scale(0.4);}20%{opacity:0.95;}100%{opacity:0; transform:translateY(-72px) scale(1.15);}}

  /* extra particle effects */
  .creature.fx-play-c .fx-play-c-el{display:block;}
  .creature.fx-play-c .fx-play-c-el .fx-inner{animation:fxNotes 1s ease-out forwards;}

  .creature.fx-poke .fx-poke-el{display:block;}
  .creature.fx-poke .fx-poke-el .fx-inner{animation:fxPoke 0.7s ease-out forwards;}
  @keyframes fxPoke{0%{opacity:0; transform:scale(0.6);}30%{opacity:1;}100%{opacity:0; transform:scale(1.25);}}

  /* night mode while he sleeps */
  #nightOverlay{
    position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0; transition:opacity 0.9s ease;
    background:linear-gradient(180deg, rgba(14,18,48,0.8), rgba(28,32,74,0.62));
  }
  body.sleeping #nightOverlay{opacity:1;}
  #nightOverlay span{position:absolute; width:3px; height:3px; border-radius:50%; background:#fff; animation:starTwinkle 2.4s ease-in-out infinite;}
  #nightOverlay span:nth-child(1){top:12%; left:18%;}
  #nightOverlay span:nth-child(2){top:20%; left:72%; animation-delay:0.6s;}
  #nightOverlay span:nth-child(3){top:8%; left:46%; animation-delay:1.1s;}
  #nightOverlay span:nth-child(4){top:30%; left:88%; animation-delay:0.3s;}
  #nightOverlay span:nth-child(5){top:26%; left:10%; animation-delay:1.6s;}
  #nightOverlay span:nth-child(6){top:16%; left:60%; animation-delay:0.9s;}

  #nightOverlay .moon{position:absolute; top:10%; right:11%; width:34px; height:34px; border-radius:50%; box-shadow:inset -10px 4px 0 0 #fff6c9;}
  body.sleeping #label, body.sleeping #header{color:#dfe6ff; opacity:0.8;}

  .fx-wash-el .shower-head{opacity:0; animation:showerShow 1.7s ease-out forwards;}

  @keyframes wdropFall{0%{opacity:0; transform:translateY(0);}15%{opacity:1;}100%{opacity:0; transform:translateY(150px);}}
  .creature.fx-wash #reactGroup{filter:saturate(1.15) brightness(1.06);}

  /* mini-games */
  .game-panel{background:white; color:#2c3a36; border-radius:24px; width:min(92vw,360px); padding:16px; max-height:94vh; display:flex; flex-direction:column; gap:8px; box-shadow:0 24px 48px rgba(0,0,0,0.25); transform:scale(0.94); transition:transform 0.2s;}
  .overlay.show .game-panel{transform:scale(1);}

  #gamePet.hiding svg{opacity:0.05;}
  #gameInfo{text-align:center; font-weight:700; font-size:14px; min-height:20px;}
  #gameArea{position:relative; min-height:210px;}
  .catch-area{height:250px; overflow:hidden; border-radius:16px; background:linear-gradient(180deg,#eef4ff,#dbe6ff); touch-action:manipulation;}
  .fall{position:absolute; top:-46px; font-size:34px; background:none; border:none; padding:4px; cursor:pointer; animation:fallDown linear forwards; touch-action:manipulation; -webkit-user-select:none; user-select:none;}
  @keyframes fallDown{to{transform:translateY(310px);}}
  .float-txt{position:absolute; font-weight:800; font-size:18px; color:#2c3a36; pointer-events:none; animation:floatUpTxt 0.6s ease-out forwards;}
  @keyframes floatUpTxt{from{opacity:1; transform:translateY(0);}to{opacity:0; transform:translateY(-28px);}}
  .cups{display:flex; justify-content:center; gap:12px; margin-top:26px;}

  .cup:disabled{opacity:0.6;}
  .cup:active, .rps:active{transform:scale(0.94);}
  .rps-res{text-align:center; font-weight:700; min-height:44px; margin:14px 0 10px; font-size:15px;}
  .rps-btns{display:flex; justify-content:center; gap:12px;}
  .game-result{text-align:center; display:flex; flex-direction:column; gap:10px; align-items:center; padding:14px 6px;}
  .gr-title{font-size:22px; font-weight:800;}
  .gr-sub{font-size:14px; opacity:0.75;}
  .gr-btns{display:flex; gap:10px; margin-top:6px;}

  /* speech bubble */
  #bubbleWrap{
    min-height:70px; display:flex; align-items:flex-start; justify-content:center;
    width:min(90vw,320px); margin-top:2px; z-index:1;
  }
  #bubble{
    background:white; color:#2c3a36; padding:13px 20px; border-radius:20px;
    font-size:14px; font-weight:600; max-width:280px; text-align:center; line-height:1.35;

    transition:opacity 0.3s ease, transform 0.3s ease, border-color 0.4s;
  }
  #bubble.show{opacity:1; transform:translateY(0) scale(1);}

  #label{margin-top:2px; font-size:13px; opacity:0.5; font-weight:600; letter-spacing:0.02em; z-index:1;}

  #buttons{
    position:fixed; left:0; right:0; bottom:0; z-index:5;

  }
  .btn-wrap{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .btn{
    width:min(54px,15vw); height:min(54px,15vw); border-radius:50%; border:3px solid var(--body2);
    background:white; color:#2c3a36; display:flex; align-items:center; justify-content:center; padding:0;
    box-shadow:0 8px 18px rgba(0,0,0,0.12);
    transition:transform 0.15s, border-color 0.4s, background 0.3s;
  }
  .btn:active{transform:scale(0.88);}
  .btn svg{width:24px; height:24px;}
  .btn .icon-sun{display:none;}
  .btn.is-on{background:#ffe9a8;}
  .btn.is-on .icon-moon{display:none;}
  .btn.is-on .icon-sun{display:block;}
  .btn-label{font-size:10px; font-weight:800; letter-spacing:0.02em; color:#2c3a36; opacity:0.78; background:rgba(255,255,255,0.88); padding:2px 6px; border-radius:8px;}

</head>

  // so a phrase does not come back until everything else in the pool has been used
  const RECENT_KEY = 'bulk_recent_v1';
  let globalRecent = [];

  const bags = {};
  function pickFresh(key, arr){
    if(!arr || !arr.length) return '';
    const sig = arr.length + '|' + arr[0];
    let bag = bags[key];
    if(!bag || bag.sig !== sig){ bag = bags[key] = {sig: sig, left: []}; }
    if(!bag.left.length){
      bag.left = arr.map((_,i)=>i);
      for(let i=bag.left.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        const t = bag.left[i]; bag.left[i] = bag.left[j]; bag.left[j] = t;
      }
    }
    let idx = -1;
    for(let k=bag.left.length-1;k>=0;k--){
      if(globalRecent.indexOf(arr[bag.left[k]]) === -1){ idx = k; break; }
    }
    if(idx === -1) idx = bag.left.length - 1;
    const line = arr[bag.left.splice(idx,1)[0]];
    globalRecent.push(line);
    if(globalRecent.length > 26) globalRecent.shift();
    try{ localStorage.setItem(RECENT_KEY, JSON.stringify(globalRecent)); }catch(e){}
    return line;
  }

  function weightedPick(list){
    const total = list.reduce((s,x)=>s+x.weight,0);
    let r = Math.random()*total;
    for(const item of list){ if((r-=item.weight)<0) return item; }
    return list[0];
  }

  /* ---------- sound engine (tiny Web Audio synth, no assets) ---------- */
  let actx = null;
  function ctx(){
    if(!actx){
      try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    }
    if(actx.state==='suspended') actx.resume().catch(()=>{});
    return actx;
  }
  function beep(freq, dur, delay, type, gain){
    if(!settings.sound) return;
    const c = ctx();
    if(!c) return;
    try{
      const t0 = c.currentTime + (delay||0);
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type||'sine';
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain||0.12, t0+0.015);
      g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
      osc.connect(g).connect(c.destination);
      osc.start(t0);
      osc.stop(t0+dur+0.02);
    }catch(e){}
  }
  function sweep(f1, f2, dur, type, gain){
    if(!settings.sound) return;
    const c = ctx();
    if(!c) return;
    try{
      const t0 = c.currentTime;
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type||'sine';
      osc.frequency.setValueAtTime(f1, t0);
      osc.frequency.exponentialRampToValueAtTime(f2, t0+dur);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain||0.1, t0+0.015);
      g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
      osc.connect(g).connect(c.destination);
      osc.start(t0);
      osc.stop(t0+dur+0.02);
    }catch(e){}
  }

  // new pets should not repeat: avoid species/traits already in the roster and the last few released ones
  function createNewPet(){
    let recentSpecies = [];
    try{
      const col = JSON.parse(localStorage.getItem(COLLECTION_KEY) || '[]');
      recentSpecies = col.slice(-3).map(x=>x.species);
    }catch(e){}
    const ownedSpecies = roster.map(p=>p.species);
    let pool = SPECIES.filter(s=>ownedSpecies.indexOf(s.id)===-1);
    const fresh = pool.filter(s=>recentSpecies.indexOf(s.id)===-1);
    if(fresh.length) pool = fresh;
    if(!pool.length) pool = SPECIES;
    const sp = weightedPick(pool);
    const ownedTraits = roster.map(p=>p.trait);
    let tpool = TRAITS.filter(t=>ownedTraits.indexOf(t.id)===-1);
    if(!tpool.length) tpool = TRAITS;
    const tr = pick(tpool);
    const now = Date.now();
    return {
      id: makeId(),
      species: sp.id, trait: tr.id, nickname: null,
      createdAt: now, lastInteraction: now,
      lastFed: now, lastPlayed: now, lastWashed: now, feedCount: 0, nextPoopAt: null,
      lastStageSeen: 'baby', pokes: 0, hintShown: false, mess: 0, games: {},
      totalInteractions: 0, neglectCount: 0,
      lastOpenDate: todayStr(), streakDays: 1,
      auraUnlocked:false, scarUnlocked:false, accessoryUnlocked:false
    };
  }

  function computeStats(s){
    const now = Date.now();
    const hoursSinceFed = (now-(s.lastFed||s.createdAt))/3600000;
    const hoursSincePlayed = (now-(s.lastPlayed||s.createdAt))/3600000;
    return {
      hunger: Math.max(0, 100 - hoursSinceFed*2.2),
      fun: Math.max(0, 100 - hoursSincePlayed*2.8)
    };
  }

  function hoursSinceWash(s){ return (Date.now()-(s.lastWashed||s.createdAt))/3600000; }
  // gets dirty after 30h, or after a lot of eating/playing (crumbs, sweat)
  function isDirty(s){ return hoursSinceWash(s) > 30 || (s.mess||0) >= 6; }
  function isClean(s){ return hoursSinceWash(s) < 10 && (s.mess||0) < 3; }

  function computeMood(s, isFirstPaintReunion){
    if(isFirstPaintReunion) return 'ecstatic';
    if(sleeping) return 'sleepy';
    const now = Date.now();
    const {hunger, fun} = computeStats(s);
    const hoursSinceAny = (now-s.lastInteraction)/3600000;
    const h = new Date().getHours();
    const night = (h>=23 || h<7);
    if(hoursSinceAny>72 || (hunger<12 && fun<12)) return 'gloomy';
    if(hoursSinceAny>24) return 'sad';
    if(hunger<30) return 'hungry';
    if(fun<30) return 'bored';
    if(night) return 'sleepy';
    return 'happy';
  }

    const poopVisible = !!(state.nextPoopAt && Date.now() >= state.nextPoopAt);
    updateCosmetics(state, poopVisible);
    const sp = speciesById(state.species);
    const tr = traitById(state.trait);
    const label = state.nickname ? (state.nickname + ' · ' + sp.name + ' · ' + tr.name) : (sp.name + ' · ' + tr.name);

  function showBubble(text){
    const b = document.getElementById('bubble');
    clearTimeout(showBubble._t);
    clearTimeout(showBubble._swapT);
    const apply = () => {
      b.textContent = text;
      b.classList.add('show');
      showBubble._t = setTimeout(()=>b.classList.remove('show'), 2900);
    };
    if(b.classList.contains('show')){
      // cross-fade: let the old line fade out before the new one fades in, instead of an abrupt swap
      b.classList.remove('show');
      showBubble._swapT = setTimeout(apply, 190);
    } else {
      apply();
    }
  }

  function playEffect(kind){
    const variants = kind==='play' ? ['a','b','c'] : ['a','b'];
    timedClass('fx-' + kind + '-' + pick(variants), 1000);
  }
  function playPokeFx(){ timedClass('fx-poke', 750); }
  function playWashFx(){ timedClass('fx-wash', 1900); }
  function playJackpot(){ timedClass('fx-jackpot', 1000); }

  const FEED_DURATION = 620;
  const WASH_DURATION = 720;
  function playFeedAnimation(){
    const c = document.getElementById('creature');
    c.querySelectorAll('.feed-item').forEach(el=>el.classList.remove('show-item'));
    const item = c.querySelector('.feed-item-' + pick(['a','b','c']));
    if(item) item.classList.add('show-item');
    c.classList.remove('feeding'); void c.offsetWidth;
    c.classList.add('feeding');
    setTimeout(()=>playSound('bite'), FEED_DURATION*0.55);
    setTimeout(()=>c.classList.remove('feeding'), FEED_DURATION + 80);
  }

  function checkGrowth(){
    const s = stageOf(state);
    if(s !== state.lastStageSeen){
      state.lastStageSeen = s;
      saveRoster();
      showBubble(pickFresh('growth', LINES.growth));
      playSound('growth');
      timedClass('grow-flash', 900);
    }
  }

  function cleanPoop(){
    if(!state || !state.nextPoopAt) return;
    if(sleeping){ wakeUp('interrupt'); return; }
    lastAction = Date.now();
    const inner = document.getElementById('creature').querySelector('.poop-inner');
    if(inner) inner.classList.add('cleaning');
    state.nextPoopAt = null;
    saveRoster();
    showBubble(pickFresh('clean', LINES.clean));
    playSound('clean');
    vibrate(10);
    setTimeout(()=>render(computeMood(state,false)), 320);
  }

  /* ---------- smart phrase picking: context, time of day, age, species, trait ---------- */
  function timeLines(h){
    if(h>=23 || h<6) return LINES.time.night;
    if(h<11) return LINES.time.morning;
    if(h>=18) return LINES.time.evening;
    return null;
  }

  function chooseLine(kind){
    const st = computeStats(state);
    const h = new Date().getHours();
    const dirty = isDirty(state);

    if(kind==='feed' && st.hunger<30) return pickFresh('ctx_feed', LINES.ctx.feedStarving);
    if(kind==='feed' && st.hunger>88) return pickFresh('ctx_feed', LINES.ctx.feedFull);
    if(kind==='play' && st.fun<30) return pickFresh('ctx_play', LINES.ctx.playBored);
    if(kind==='play' && st.hunger<30) return pickFresh('ctx_play', LINES.ctx.playHungry);
    if(kind==='pet' && dirty) return pickFresh('ctx_pet', LINES.ctx.petDirty);
    if(kind==='poke' && st.hunger<30) return pickFresh('ctx_poke', LINES.ctx.pokeHungry);
    if(kind==='poke' && dirty) return pickFresh('ctx_poke', LINES.ctx.pokeDirty);

    if(Math.random()<0.12){ const t = timeLines(h); if(t) return pickFresh('time', t); }
    if(stageOf(state)==='baby' && Math.random()<0.22) return pickFresh('baby', LINES.baby);
    if(Math.random()<0.2) return pickFresh('sp_'+state.species, LINES.species[state.species]);
    const tp = LINES.trait[state.trait] && LINES.trait[state.trait][kind];
    if(tp && Math.random()<0.3) return pickFresh('tr_'+state.trait+kind, tp);
    return pickFresh(kind, LINES[kind]);
  }

  function chooseIdleLine(){
    const h = new Date().getHours();
    if(Math.random()<0.15){ const t = timeLines(h); if(t) return pickFresh('time', t); }
    if(stageOf(state)==='baby' && Math.random()<0.25) return pickFresh('baby', LINES.baby);
    if(Math.random()<0.3) return pickFresh('sp_'+state.species, LINES.species[state.species]);
    return pickFresh('idle', LINES.idle);
  }

  /* ---------- spontaneous behaviour so he never just sits there ---------- */
  function idleFlourish(){
    if(!state) return;
    const mood = computeMood(state,false);
    let line;
    if(state.totalInteractions<8 && !state.hintShown && Math.random()<0.7){
      state.hintShown = true; saveRoster();
      line = pickFresh('hint', LINES.pokeHint);
    } else if(isDirty(state) && Math.random()<0.5){
      line = pickFresh('dirtyR', LINES.dirtyReminder);
    } else if(['hungry','bored','sad','gloomy'].indexOf(mood)!==-1 && Math.random()<0.6){
      line = pickFresh('idle_'+mood, LINES[mood==='sad' ? 'gloomy' : mood]);
    } else {
      line = chooseIdleLine();
    }
    const r = Math.random();
    if(r<0.35) playReact(pick(['hop2','sway','shake','spin','peek']));
    else if(r<0.62){ flashMood(pick(['silly','love','shock','playful']), 1800); bounce(); }
    else bounce();
    showBubble(line);
    playSound('idle');
  }

  function washRefuse(){
    lastAction = Date.now();
    combo.kind = null; combo.count = 0;
    render('shock');
    playReact('dodge');
    showBubble(pickFresh('washClean', LINES.washClean));
    playSound('shock');
    vibrate(8);
    clearTimeout(interact._t);
    interact._t = setTimeout(()=>render(computeMood(state,false)), 2200);
  }

  function sleepTalk(){
    showBubble(pickFresh('sleepTalk', LINES.sleepTalk));
    playSound('idle');
  }

  function scheduleIdle(){
    setTimeout(()=>{
      try{
        const hatchOpen = !document.getElementById('hatch').classList.contains('hidden');
        if(state && !document.hidden && !reunion && !hatchOpen && !gameOpen){
          if(sleeping){ if(Math.random()<0.7) sleepTalk(); }
          else if(Date.now()-lastAction>7000 && Math.random()<0.6) idleFlourish();
        }
      }catch(e){}
      scheduleIdle();
    }, 15000 + Math.random()*20000);
  }

  /* ---------- sleep ---------- */
  function updateSleepUI(){
    document.body.classList.toggle('sleeping', sleeping);
    const b = document.getElementById('btnSleep');
    if(b) b.classList.toggle('is-on', sleeping);
    const l = document.getElementById('sleepLabel');
    if(l) l.textContent = sleeping ? 'Будить' : 'Спать';
  }
  function goToSleep(){
    if(!state || sleeping) return;
    sleeping = true; sleepStart = Date.now(); lastAction = Date.now();
    clearTimeout(interact._t); clearTimeout(flashMood._t);
    updateSleepUI();
    render('sleepy');
    showBubble(pickFresh('sleepStart', LINES.sleepStart));
    playSound('sleep');
    vibrate(10);
  }
  function wakeUp(reason){
    if(!sleeping || !state) return;
    const dur = Date.now() - sleepStart;
    sleeping = false; lastAction = Date.now();
    state.lastInteraction = Date.now();
    saveRoster();
    updateSleepUI();
    const rested = dur >= 25000;
    let mood, line;
    if(rested){
      mood = 'ecstatic'; line = pickFresh('wakeR', LINES.wakeRested); playSound('wake');
    } else {
      mood = 'grumpy';
      line = reason==='interrupt' ? pickFresh('wakeI', LINES.wakeInterrupt) : pickFresh('wakeE', LINES.wakeEarly);
      playSound('grumpy');
    }
    render(mood);
    bounce();
    playReact(rested ? 'hop2' : 'shake');
    showBubble(line);
    vibrate(rested ? [8,20,8] : [15,30,15]);
    clearTimeout(interact._t);
    interact._t = setTimeout(()=>render(computeMood(state,false)), 2500);
  }
  function toggleSleep(){ sleeping ? wakeUp('button') : goToSleep(); }

  /* ---------- the main interaction pipeline ---------- */
  function interact(kind){
    if(!state) return;
    if(sleeping){ wakeUp('interrupt'); return; }
    if(kind==='wash' && isClean(state)){ washRefuse(); return; }
    const now = Date.now();
    lastAction = now;
    state.totalInteractions++;
    state.lastInteraction = now;
    const wasDirty = isDirty(state);
    const washedRecently = state.lastWashed && (now - state.lastWashed) < 2*3600000;
    if(kind==='feed'){
      state.lastFed = now;
      state.mess = (state.mess||0) + 1;
      state.feedCount = (state.feedCount||0)+1;
      if(state.feedCount % 3 === 0 && !state.nextPoopAt){
        state.nextPoopAt = now + (2 + Math.random()*4)*3600000;
      }
    }
    if(kind==='play'){ state.lastPlayed = now; state.mess = (state.mess||0) + 1; }
    if(kind==='wash'){ state.lastWashed = now; state.mess = 0; }
    if(kind==='poke') state.pokes = (state.pokes||0)+1;
    if(state.totalInteractions>=30) state.auraUnlocked = true;
    if(state.streakDays>=5) state.accessoryUnlocked = true;
    saveRoster();

    // rapid-tap tracking (session-only) — spam the same action and the pet notices
    if(kind===combo.kind && now-combo.time<1300){ combo.count++; } else { combo.count=1; }
    combo.kind = kind; combo.time = now;

    // secret sequence: feed -> play -> pet within 6s
    seqCombo.push({kind, time: now});
    if(seqCombo.length>3) seqCombo.shift();
    const isCombo = seqCombo.length===3 &&
      seqCombo[0].kind==='feed' && seqCombo[1].kind==='play' && seqCombo[2].kind==='pet' &&
      (seqCombo[2].time - seqCombo[0].time) < 6000;
    if(isCombo) seqCombo.length = 0;

    const milestone = MILESTONES[state.totalInteractions];
    const isOverload = !milestone && !isCombo && combo.count>=4;
    const isRepeat = !milestone && !isCombo && !isOverload && combo.count===3;
    const isJackpot = !milestone && !isCombo && !isOverload && !isRepeat && Math.random()<0.1;
    const celebrate = !!milestone || isCombo || isJackpot;

    let mood, line, soundKind, reactName;
    if(milestone){
      mood = 'ecstatic'; line = milestone; soundKind = 'combo'; reactName = 'spin';
    } else if(isCombo){
      mood = 'ecstatic'; line = pickFresh('combo', LINES.combo); soundKind = 'combo'; reactName = 'spin';
    } else if(isOverload){
      mood = 'dizzy'; line = pickFresh('ov_'+kind, LINES.overload[kind]); soundKind = 'overload'; reactName = 'shake';
    } else if(isJackpot){
      mood = 'ecstatic'; line = pickFresh('jackpot', LINES.jackpot); soundKind = 'jackpot'; reactName = pick(['spin','hop2']);
    } else if(isRepeat){
      mood = 'shock'; line = pickFresh('rep_'+kind, LINES.repeat[kind]); soundKind = 'shock'; reactName = 'hop2';
    } else {
      if(kind==='wash'){
        line = wasDirty ? pickFresh('washDirty', LINES.washDirty)
             : (washedRecently ? pickFresh('washAgain', LINES.washAgain) : chooseLine('wash'));
      } else {
        line = chooseLine(kind);
      }
      mood = pick(MOODS_BY_KIND[kind]);
      soundKind = kind;
      reactName = pick(REACTS[kind]);
    }

    const react = () => {
      render(mood);
      bounce();
      playReact(reactName);
      if(kind==='play' || kind==='pet') playEffect(kind);
      if(kind==='poke') playPokeFx();
      if(celebrate) playJackpot();
      showBubble(line);
      playSound(soundKind);
      if(isCombo || milestone) vibrate([10,30,10,30,10]);
      else if(isOverload) vibrate([15,30,15,30]);
      else if(isJackpot) vibrate([10,20,10,20,10]);
      else vibrate(12);
      clearTimeout(interact._t);
      clearTimeout(flashMood._t);
      interact._t = setTimeout(()=>render(computeMood(state,false)), isOverload ? 2700 : 2400);
    };

    if(kind==='feed'){
      // real feeding: the food travels to the mouth and gets eaten first, reaction follows
      playFeedAnimation();
      vibrate(8);
      setTimeout(react, FEED_DURATION);
    } else if(kind==='wash'){
      playWashFx();
      playSound('wash');
      setTimeout(react, WASH_DURATION);
    } else {
      react();
    }
  }

  function tick(){
    if(reunion || !state) return;
    render(computeMood(state,false));
    checkGrowth();
  }

  /* ---------- mini-games ---------- */
  let gameTimers = [];
  let gamePetClone = null;
  let gameResult = null;
  let currentGame = null;
  function gtimeout(fn, ms){ const t = setTimeout(fn, ms); gameTimers.push(t); return t; }
  function gclear(){ gameTimers.forEach(t=>{ clearTimeout(t); clearInterval(t); }); gameTimers = []; }
  function gamePetMood(m, revertMs){
    if(!gamePetClone || !state) return;
    gamePetClone.setAttribute('class', 'creature species-' + state.species + ' mood-' + m + ' stage-' + stageOf(state));
    if(revertMs) gtimeout(()=>gamePetMood('happy'), revertMs);
  }
  function openGameMenu(){
    if(sleeping){ wakeUp('interrupt'); return; }
    if(!state) return;
    document.getElementById('gameMenuOverlay').classList.add('show');
  }
  function closeGameMenu(){ document.getElementById('gameMenuOverlay').classList.remove('show'); }

  function startGame(name){
    closeGameMenu();
    gclear();
    gameResult = null; gameOpen = true; currentGame = name; lastAction = Date.now();
    const pet = document.getElementById('gamePet');
    pet.innerHTML = ''; pet.classList.remove('hiding');
    const clone = document.getElementById('creature').cloneNode(true);
    clone.removeAttribute('id');
    const dd = clone.querySelector('defs'); if(dd) dd.remove();
    clone.style.width = '100%'; clone.style.height = '100%';
    pet.appendChild(clone);
    gamePetClone = clone;
    gamePetMood('happy');
    const titles = {catch:'Поймай звёздочки', hide:'Прятки', rps:'Камень-ножницы-бумага'};
    document.getElementById('gameTitle').textContent = titles[name];
    document.getElementById('gameOverlay').classList.add('show');
    ({catch:gameCatch, hide:gameHide, rps:gameRps})[name]();
  }
  function closeGame(){
    gclear();
    gameOpen = false; gamePetClone = null;
    document.getElementById('gameOverlay').classList.remove('show');
    document.getElementById('gamePet').innerHTML = '';
    if(gameResult && state){ const r = gameResult; gameResult = null; afterGame(r); }
    if(state) render(computeMood(state,false));
  }
  function afterGame(r){
    const line = pickFresh('game_' + r.tier, GAME_LINES[r.tier]);
    flashMood(r.tier==='meh' ? 'playful' : 'ecstatic', 2600);
    bounce();
    playReact(r.tier==='great' ? 'spin' : 'hop2');
    if(r.tier==='great') playJackpot();
    showBubble(line);
  }

  function finishGame(name, score, tier, summary){
    const now = Date.now();
    state.lastPlayed = now; state.lastInteraction = now;
    state.totalInteractions++;
    state.mess = (state.mess||0) + 1;
    state.games = state.games || {};
    const best = state.games[name] || 0;
    const isNew = score > best;
    if(isNew) state.games[name] = score;
    if(state.totalInteractions>=30) state.auraUnlocked = true;
    saveRoster();
    gameResult = {tier: tier};
    document.getElementById('gamePet').classList.remove('hiding');
    gamePetMood(tier==='meh' ? 'sad' : 'ecstatic');
    playSound(tier==='great' ? 'combo' : (tier==='ok' ? 'jackpot' : 'shock'));
    vibrate(tier==='meh' ? 10 : [10,20,10,20,10]);
    const heading = tier==='great' ? 'Отлично!' : (tier==='ok' ? 'Неплохо!' : 'Бывает!');
    const area = document.getElementById('gameArea');
    document.getElementById('gameInfo').textContent = '';
    area.className = '';
    area.innerHTML =
      '<div class="game-result"><div class="gr-title">' + heading + '</div>' +
      '<div class="gr-sub">' + summary + '</div>' +
      '<div class="gr-sub">Рекорд: ' + state.games[name] + (isNew && best>0 ? ' — новый!' : '') + '</div>' +
      '<div class="gr-btns"><button class="confirm-btn secondary" id="grClose">Закрыть</button>' +
      '<button class="confirm-btn primary" id="grAgain">Ещё раз</button></div></div>';
    document.getElementById('grClose').addEventListener('click', closeGame);
    document.getElementById('grAgain').addEventListener('click', ()=>{ gameResult = null; startGame(name); });
  }

  function gameCatch(){
    const area = document.getElementById('gameArea');
    const info = document.getElementById('gameInfo');
    area.className = 'catch-area';
    area.innerHTML = '';
    let score = 0, timeLeft = 20, alive = true;
    const upd = () => { info.textContent = 'Лови ⭐ пальцем, 💩 не трогай!  Счёт: ' + score + ' · ' + timeLeft + ' c'; };
    upd();
    const spawn = () => {
      if(!alive) return;
      const r = Math.random();
      const kind = r < 0.14 ? 'gold' : (r < 0.3 ? 'bad' : 'star');
      const el = document.createElement('button');
      el.className = 'fall';
      el.textContent = kind==='gold' ? '🌟' : (kind==='bad' ? '💩' : '⭐');
      el.style.left = (4 + Math.random()*80) + '%';
      el.style.animationDuration = (1.7 + Math.random()*1.1) + 's';
      const hit = (ev) => {
        ev.preventDefault();
        if(el.dataset.done || !alive) return;
        el.dataset.done = '1';
        const ar = area.getBoundingClientRect(), er = el.getBoundingClientRect();
        const fl = document.createElement('span');
        fl.className = 'float-txt';
        fl.style.left = (er.left - ar.left + 6) + 'px';
        fl.style.top = (er.top - ar.top) + 'px';
        if(kind==='bad'){ score = Math.max(0, score-2); fl.textContent = '-2'; gamePetMood('shock', 500); playSound('shock'); }
        else { const add = kind==='gold' ? 3 : 1; score += add; fl.textContent = '+' + add; gamePetMood('ecstatic', 450); playSound('poke'); }
        area.appendChild(fl);
        setTimeout(()=>fl.remove(), 600);
        el.remove();
        upd();
      };
      el.addEventListener('pointerdown', hit);
      el.addEventListener('animationend', ()=>el.remove());
      area.appendChild(el);
      gtimeout(spawn, Math.max(280, 620 - (20-timeLeft)*16) + Math.random()*260);
    };
    spawn();
    const iv = setInterval(()=>{
      timeLeft--;
      upd();
      if(timeLeft <= 0){
        clearInterval(iv);
        alive = false;
        area.innerHTML = '';
        finishGame('catch', score, score>=18 ? 'great' : (score>=9 ? 'ok' : 'meh'), 'Поймано очков: ' + score);
      }
    }, 1000);
    gameTimers.push(iv);
  }

  function gameHide(){
    const area = document.getElementById('gameArea');
    const info = document.getElementById('gameInfo');
    const pet = document.getElementById('gamePet');
    area.className = '';
    area.innerHTML = '<div class="cups"></div>';
    const cupsEl = area.firstChild;
    const cups = [0,1,2].map(i=>{
      const b = document.createElement('button');
      b.className = 'cup'; b.textContent = '🌿';
      cupsEl.appendChild(b);
      return b;
    });
    let round = 0, found = 0, hideIdx = 0, tries = 2, busy = false;
    const setInfo = () => { info.textContent = 'Раунд ' + round + '/5 · Найдено: ' + found + ' · Где я спрятался?'; };
    const next = () => {
      round++;
      if(round > 5){
        finishGame('hide', found, found>=4 ? 'great' : (found>=2 ? 'ok' : 'meh'), 'Найдено: ' + found + ' из 5');
        return;
      }
      hideIdx = Math.floor(Math.random()*3); tries = 2; busy = false;
      cups.forEach(c=>{ c.textContent = '🌿'; c.disabled = false; });
      pet.classList.add('hiding');
      gamePetMood('happy');
      setInfo();
    };
    cups.forEach((c,i)=>{
      c.addEventListener('click', ()=>{
        if(busy || c.disabled) return;
        if(i === hideIdx){
          busy = true; found++;
          c.textContent = '🎉';
          pet.classList.remove('hiding');
          gamePetMood('ecstatic');
          playSound('jackpot');
          gtimeout(next, 1100);
        } else {
          tries--;
          c.textContent = '❌'; c.disabled = true;
          gamePetMood('silly', 500);
          playSound('shock');
          if(tries === 0){
            busy = true;
            cups[hideIdx].textContent = '🫣';
            pet.classList.remove('hiding');
            gamePetMood('shock');
            gtimeout(next, 1250);
          }
        }
      });
    });
    next();
  }

  function gameRps(){
    const area = document.getElementById('gameArea');
    const info = document.getElementById('gameInfo');
    area.className = '';
    area.innerHTML = '<div class="rps-res" id="rpsRes">Выбирай!</div><div class="rps-btns"></div>';
    const opts = ['✊','✋','✌️'];
    const btns = opts.map((o,i)=>{
      const b = document.createElement('button');
      b.className = 'rps'; b.textContent = o;
      area.lastChild.appendChild(b);
      return b;
    });
    let round = 1, wins = 0, busy = false;
    const setInfo = () => { info.textContent = 'Раунд ' + round + '/5 · Побед: ' + wins; };
    setInfo();
    btns.forEach((b,i)=>{
      b.addEventListener('click', ()=>{
        if(busy) return;
        busy = true;
        const pc = Math.floor(Math.random()*3);
        let res;
        if(i === pc) res = 'draw';
        else if((i===0 && pc===2) || (i===1 && pc===0) || (i===2 && pc===1)) res = 'win';
        else res = 'lose';
        const res_el = document.getElementById('rpsRes');
        if(res==='win'){ wins++; res_el.textContent = opts[i] + ' против ' + opts[pc] + ' — ты выиграл!'; gamePetMood('shock'); playSound('poke'); }
        else if(res==='lose'){ res_el.textContent = opts[i] + ' против ' + opts[pc] + ' — я выиграл!'; gamePetMood('ecstatic'); playSound('jackpot'); }
        else { res_el.textContent = opts[i] + ' против ' + opts[pc] + ' — ничья!'; gamePetMood('silly'); playSound('idle'); }
        setInfo();
        gtimeout(()=>{
          round++;
          if(round > 5){
            finishGame('rps', wins, wins>=4 ? 'great' : (wins>=2 ? 'ok' : 'meh'), 'Побед: ' + wins + ' из 5');
            return;
          }
          busy = false;
          document.getElementById('rpsRes').textContent = 'Выбирай!';
          gamePetMood('happy');
          setInfo();
        }, 1100);
      });
    });
  }

    document.getElementById('menuSoundLabel').textContent = 'Звук: ' + (settings.sound ? 'вкл' : 'выкл');
    document.getElementById('menuOverlay').classList.add('show');

  /* ---------- collection ---------- */
  function openCollection(){
    closeMenu();
    const listEl = document.getElementById('collectionList');
    let collection = [];
    try{ collection = JSON.parse(localStorage.getItem(COLLECTION_KEY) || '[]'); }catch(e){}
    if(!collection.length){
      listEl.innerHTML = '<div class="collection-empty">Пока никого не отпускал(а).<br>Текущие питомцы тоже когда-нибудь тут появятся.</div>';
    } else {
      const fmt = d => new Date(d).toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
      listEl.innerHTML = collection.slice().reverse().map(item=>{
        const sp = speciesById(item.species);
        const tr = traitById(item.trait);
        const name = item.nickname ? (item.nickname + ' — ' + sp.name) : sp.name;
        const grad = sp.id==='rainbow' ? 'linear-gradient(135deg,#ff8fa3,#ffd15c,#8fe8cf,#5cb3ff,#b89aff)' : ('linear-gradient(135deg,'+sp.colors[0]+','+sp.colors[1]+')');
        return '<div class="collection-item">' +
          '<div class="collection-dot" style="background:' + grad + '"></div>' +
          '<div class="collection-info"><div class="collection-name">' + name + ' · ' + tr.name + '</div>' +
          '<div class="collection-dates">' + fmt(item.hatchedAt) + ' — ' + fmt(item.releasedAt) + '</div></div>' +
          '</div>';
      }).join('');
    }
    document.getElementById('collectionOverlay').classList.add('show');
  }
  function closeCollection(){
    document.getElementById('collectionOverlay').classList.remove('show');
  }

  /* ---------- roster strip (multiple pets at once) ---------- */
  function renderRosterStrip(){
    const el = document.getElementById('rosterStrip');
    if(!roster.length){ el.innerHTML=''; el.style.display='none'; return; }
    el.style.display = 'flex';
    let html = roster.map(p=>{
      const sp = speciesById(p.species);
      const grad = sp.id==='rainbow' ? 'linear-gradient(135deg,#ff8fa3,#ffd15c,#8fe8cf,#5cb3ff,#b89aff)' : ('linear-gradient(135deg,'+sp.colors[0]+','+sp.colors[1]+')');
      const activeCls = p.id===activeId ? ' active' : '';
      return '<button class="roster-dot' + activeCls + '" style="background:' + grad + '" data-id="' + p.id + '" title="' + (p.nickname||sp.name) + '"></button>';
    }).join('');
    if(roster.length < MAX_ROSTER) html += '<button class="roster-add" id="rosterAddBtn" type="button">+</button>';
    el.innerHTML = html;
    el.querySelectorAll('.roster-dot').forEach(btn=>{
      btn.addEventListener('click', ()=>switchActive(btn.getAttribute('data-id')));
    });
    const addBtn = document.getElementById('rosterAddBtn');
    if(addBtn) addBtn.addEventListener('click', requestNewPet);
  }

  function switchActive(id){
    if(id===activeId) return;
    const next = roster.find(p=>p.id===id);
    if(!next) return;
    if(sleeping){ sleeping = false; updateSleepUI(); }
    activeId = id;
    saveActiveId();
    state = next;
    if(state.lastWashed===undefined) state.lastWashed = Date.now();
    applyPalette(speciesById(state.species));
    reunion = false;
    lastAction = Date.now();
    render(computeMood(state,false));
    renderRosterStrip();
  }

  function requestNewPet(){
    if(roster.length>=MAX_ROSTER){
      window.alert('Максимум ' + MAX_ROSTER + ' питомцев одновременно. Сначала отпусти кого-нибудь.');
      return;
    }
    openHatch();
  }

  /* ---------- release / change pet ---------- */
  function openResetConfirm(){
    closeMenu();
    if(!state) return;
    const sp = speciesById(state.species), tr = traitById(state.trait);
    const name = state.nickname ? ('«' + state.nickname + '» (' + sp.name.toLowerCase() + ')') : ('«' + sp.name + '»');
    document.getElementById('resetText').textContent =
      'Отпустить ' + name + ' (' + tr.name.toLowerCase() + ') и вылупить нового?';
    document.getElementById('resetOverlay').classList.add('show');
  }
  function closeResetConfirm(){
    document.getElementById('resetOverlay').classList.remove('show');
  }
  function releasePet(){
    try{
      const collection = JSON.parse(localStorage.getItem(COLLECTION_KEY) || '[]');
      collection.push({species: state.species, trait: state.trait, nickname: state.nickname||null, hatchedAt: state.createdAt, releasedAt: Date.now()});
      localStorage.setItem(COLLECTION_KEY, JSON.stringify(collection));
    }catch(e){}
    const idx = roster.findIndex(p=>p.id===activeId);
    if(idx>-1) roster.splice(idx,1);
    saveRoster();
    localStorage.removeItem(ACTIVE_KEY);
    location.reload();
  }

  /* ---------- hatch flow (works both first-time and for "+" additions) ---------- */
  function openHatch(){
    document.getElementById('hatch').classList.remove('hidden');
    document.getElementById('eggWrap').style.display = '';
    document.getElementById('egg').classList.remove('cracking');
    document.getElementById('hatchReveal').classList.remove('show');
    document.getElementById('hatchCreatureWrap').innerHTML = '';
    cracking = false;
  }

  function crackEgg(){
    if(cracking) return;
    cracking = true;
    document.getElementById('egg').classList.add('cracking');
    setTimeout(()=>{
      const pet = createNewPet();
      roster.push(pet);
      state = pet;
      activeId = pet.id;
      if(sleeping){ sleeping = false; updateSleepUI(); }
      saveRoster();
      saveActiveId();
      document.getElementById('eggWrap').style.display = 'none';
      applyPalette(speciesById(pet.species));
      buildHatchPreview();
      document.getElementById('hatchReveal').classList.add('show');
      playSound('hatch');
      const sp = speciesById(pet.species), tr = traitById(pet.trait);
      document.getElementById('hatchName').textContent =
        'Это ' + tr.name.toLowerCase() + ' по имени «' + sp.name + '»' + (sp.rare ? ' ✨ Редкий вид!' : '');
      cracking = false;
    }, 1500);
  }

  function buildHatchPreview(){
    const wrap = document.getElementById('hatchCreatureWrap');
    const clone = document.getElementById('creature').cloneNode(true);
    clone.removeAttribute('id');
    const dupDefs = clone.querySelector('defs');
    if(dupDefs) dupDefs.remove();
    clone.style.width='100%'; clone.style.height='100%';
    clone.setAttribute('class', 'creature species-'+state.species+' mood-ecstatic stage-baby');
    wrap.appendChild(clone);
  }

  function showMain(wasGone){
    document.getElementById('hatch').classList.add('hidden');
    applyPalette(speciesById(state.species));
    reunion = !!wasGone;
    render(reunion ? 'ecstatic' : computeMood(state,false));
    if(reunion) showBubble(pickFresh('reunion', LINES.reunion));
    setTimeout(()=>{ reunion=false; render(computeMood(state,false)); checkGrowth(); }, reunion?3200:0);
    if(!tickStarted){ setInterval(tick, 60000); tickStarted = true; }
    if(!idleStarted){ scheduleIdle(); idleStarted = true; }
  }

  function bindListeners(){
    document.getElementById('header').addEventListener('click', openMenu);
    document.getElementById('menuCancel').addEventListener('click', closeMenu);
    document.getElementById('menuRename').addEventListener('click', renamePet);
    document.getElementById('menuCollection').addEventListener('click', openCollection);
    document.getElementById('menuSound').addEventListener('click', toggleSound);
    document.getElementById('menuRelease').addEventListener('click', openResetConfirm);
    document.getElementById('resetCancel').addEventListener('click', closeResetConfirm);
    document.getElementById('resetConfirmBtn').addEventListener('click', releasePet);
    document.getElementById('collectionClose').addEventListener('click', closeCollection);
    document.getElementById('egg').addEventListener('click', crackEgg);
    document.getElementById('hatchBtn').addEventListener('click', function(){ showMain(false); renderRosterStrip(); });
    document.getElementById('btnFeed').addEventListener('click', ()=>interact('feed'));
    document.getElementById('btnPlay').addEventListener('click', openGameMenu);
    document.getElementById('gmPlay').addEventListener('click', ()=>{ closeGameMenu(); interact('play'); });
    document.getElementById('gmCancel').addEventListener('click', closeGameMenu);
    document.querySelectorAll('[data-game]').forEach(b=>b.addEventListener('click', ()=>startGame(b.getAttribute('data-game'))));
    document.getElementById('gameClose').addEventListener('click', closeGame);
    document.getElementById('btnPet').addEventListener('click', ()=>interact('pet'));
    document.getElementById('btnWash').addEventListener('click', ()=>interact('wash'));
    document.getElementById('btnSleep').addEventListener('click', toggleSleep);
    document.getElementById('bodyGroup').addEventListener('click', ()=>interact('poke'));
    document.querySelector('.poop').addEventListener('click', cleanPoop);
  }

  function boot(){
    bindListeners();

    if(!roster.length){
      openHatch();
      return;
    }

    if(!state.lastFed) state.lastFed = state.createdAt;
    if(!state.lastPlayed) state.lastPlayed = state.createdAt;
    if(!state.lastWashed) state.lastWashed = Date.now();
    if(!state.lastStageSeen) state.lastStageSeen = stageOf(state);
    if(state.nickname===undefined) state.nickname = null;

    const wasGone = (Date.now()-state.lastInteraction)/3600000 > 20;
    const today = todayStr();
    if(state.lastOpenDate !== today){
      const yest = new Date(Date.now()-86400000).toISOString().slice(0,10);
      state.streakDays = (state.lastOpenDate===yest) ? state.streakDays+1 : 1;
      state.lastOpenDate = today;
    }
    if(wasGone) state.neglectCount++;
    if(state.neglectCount>=2) state.scarUnlocked = true;
    saveActiveId();
    saveRoster();
    showMain(wasGone);
    renderRosterStrip();
  }

  boot();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
