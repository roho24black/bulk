<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Бульк</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#eafaf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Бульк">
<style>
  :root{
    --bg1:#eafaf6; --bg2:#d6f5ec; --body1:#8fe8cf; --body2:#3fc9a4; --ink:#2c3a36;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; height:100%; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",sans-serif;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--ink);
    transition:background 0.8s ease, color 0.8s ease;
  }
  #app{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  }

  /* ambient background life — soft drifting blobs + clouds so the scene never sits dead still */
  #ambient{position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none;}
  #ambient span{
    position:absolute; border-radius:50%; background:var(--body2); opacity:0.16; filter:blur(2px);
    animation:drift 14s ease-in-out infinite;
  }
  #ambient span:nth-child(1){width:90px; height:90px; left:8%; top:14%; animation-duration:16s;}
  #ambient span:nth-child(2){width:50px; height:50px; right:12%; top:22%; animation-duration:12s; animation-delay:-3s;}
  #ambient span:nth-child(3){width:70px; height:70px; left:14%; bottom:20%; animation-duration:18s; animation-delay:-7s;}
  #ambient span:nth-child(4){width:40px; height:40px; right:16%; bottom:28%; animation-duration:11s; animation-delay:-5s;}
  #ambient span:nth-child(5){width:110px; height:110px; right:-30px; top:50%; animation-duration:20s; animation-delay:-9s;}
  @keyframes drift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(14px,-18px) scale(1.12);}}

  #ambient .cloud{
    position:absolute; border-radius:50%; background:white; opacity:0.5; filter:blur(1px);
    animation:cloudDrift 30s linear infinite;
  }
  #ambient .cloud.c1{width:80px; height:26px; top:9%; left:-100px; animation-duration:26s;}
  #ambient .cloud.c2{width:56px; height:20px; top:16%; left:-100px; animation-duration:34s; animation-delay:-14s; opacity:0.35;}
  @keyframes cloudDrift{from{transform:translateX(0);}to{transform:translateX(calc(100vw + 160px));}}

  #ground{
    position:fixed; left:-10%; right:-10%; bottom:0; height:34vh; z-index:0; pointer-events:none;
    background:var(--body2); opacity:0.16;
    border-radius:50% 50% 0 0 / 70px 70px 0 0;
    transition:background 0.8s ease;
  }

  #header{
    position:fixed; top:calc(16px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    text-align:center; font-size:13px; font-weight:800; letter-spacing:0.16em;
    opacity:0.45; z-index:5; background:none; border:none; color:inherit; font-family:inherit;
    padding:6px 12px; cursor:pointer;
  }
  #header:active{opacity:0.7;}

  #rosterStrip{
    position:fixed; top:calc(48px + env(safe-area-inset-top)); left:0; right:0;
    display:none; justify-content:center; align-items:center; gap:9px; z-index:4; padding:0 16px;
  }
  .roster-dot{
    width:30px; height:30px; border-radius:50%; border:2px solid transparent; padding:0;
    cursor:pointer; flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,0.15); transition:transform 0.15s;
  }
  .roster-dot.active{border-color:var(--ink); transform:scale(1.15);}
  .roster-add{
    width:28px; height:28px; border-radius:50%; border:2px dashed rgba(0,0,0,0.3); background:none;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700;
    color:var(--ink); opacity:0.5; cursor:pointer; flex-shrink:0;
  }

  /* ---------- HATCH SCREEN ---------- */
  #hatch{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:28px; text-align:center; padding:24px;
    background:linear-gradient(180deg,var(--bg1),var(--bg2)); transition:background 0.8s ease; z-index:20;
  }
  #hatch.hidden{display:none;}
  #hatch h1{font-size:22px; margin:0; font-weight:700;}
  #hatch p{font-size:15px; opacity:0.7; margin:0; max-width:260px; line-height:1.4;}
  #egg{
    width:140px; height:170px; cursor:pointer;
    filter:drop-shadow(0 12px 20px rgba(0,0,0,0.12));
    animation:eggIdle 2.6s ease-in-out infinite;
  }
  @keyframes eggIdle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  #egg.cracking{animation:eggShake 0.5s ease-in-out 3;}
  @keyframes eggShake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-6px) rotate(-4deg)}75%{transform:translateX(6px) rotate(4deg)}}
  #hatchReveal{display:none; flex-direction:column; align-items:center; gap:18px;}
  #hatchReveal.show{display:flex;}
  #hatchCreatureWrap{width:200px; height:220px;}
  #hatchName{font-size:19px; font-weight:700;}
  #hatchBtn{
    margin-top:6px; border:none; border-radius:999px; padding:14px 32px;
    background:var(--body2); color:white; font-size:16px; font-weight:600;
    box-shadow:0 6px 16px rgba(0,0,0,0.15);
  }

  /* ---------- OVERLAYS (shared look) ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,20,25,0.4); z-index:30;
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.2s;
  }
  .overlay.show{opacity:1; pointer-events:auto;}

  .confirm-card{
    background:white; color:#2c3a36; border-radius:22px; padding:26px 22px;
    max-width:280px; text-align:center; box-shadow:0 24px 48px rgba(0,0,0,0.25);
    transform:scale(0.92); transition:transform 0.2s;
  }
  .overlay.show .confirm-card{transform:scale(1);}
  .confirm-card p{margin:0 0 18px; font-size:15px; line-height:1.4; font-weight:600;}
  .confirm-actions{display:flex; gap:10px; justify-content:center;}
  .confirm-btn{border:none; border-radius:999px; padding:11px 18px; font-size:14px; font-weight:700; cursor:pointer;}
  .confirm-btn.secondary{background:#eef1f0; color:#2c3a36;}
  .confirm-btn.primary{background:#3fc9a4; color:white;}

  /* ---------- HEADER MENU ---------- */
  .menu-card{
    background:white; color:#2c3a36; border-radius:22px; padding:10px; width:260px;
    box-shadow:0 24px 48px rgba(0,0,0,0.25);
    transform:scale(0.92); transition:transform 0.2s;
  }
  .overlay.show .menu-card{transform:scale(1);}
  .menu-row{
    display:flex; align-items:center; gap:10px; width:100%; padding:13px 12px;
    background:none; border:none; font-size:15px; font-weight:600; color:#2c3a36;
    text-align:left; border-radius:12px; cursor:pointer; font-family:inherit;
  }
  .menu-row:active{background:#f0f3f2;}
  .menu-sep{height:1px; background:#eef1f0; margin:4px 8px;}
  .menu-cancel{
    margin-top:4px; width:100%; padding:12px; background:#f5f5f5; border:none;
    border-radius:12px; font-weight:700; font-size:14px; color:#2c3a36; cursor:pointer; font-family:inherit;
  }

  /* ---------- COLLECTION ---------- */
  #collectionOverlay{align-items:flex-end;}
  .collection-panel{
    background:white; color:#2c3a36; width:100%; max-width:420px; border-radius:24px 24px 0 0;
    padding:20px; max-height:72vh; display:flex; flex-direction:column;
    transform:translateY(24px); transition:transform 0.2s;
  }
  #collectionOverlay.show .collection-panel{transform:translateY(0);}
  .collection-header{display:flex; align-items:center; justify-content:space-between; font-weight:800; font-size:16px; margin-bottom:14px;}
  #collectionClose{border:none; background:#f0f3f2; width:30px; height:30px; border-radius:50%; font-size:14px; cursor:pointer; color:#2c3a36;}
  #collectionList{overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding-bottom:env(safe-area-inset-bottom);}
  .collection-item{display:flex; align-items:center; gap:12px; padding:10px; border-radius:14px; background:#f7f9f8;}
  .collection-dot{width:34px; height:34px; border-radius:50%; flex-shrink:0;}
  .collection-info{display:flex; flex-direction:column;}
  .collection-name{font-weight:700; font-size:14px;}
  .collection-dates{font-size:12px; opacity:0.55;}
  .collection-empty{text-align:center; opacity:0.5; padding:30px 10px; font-size:14px; line-height:1.5;}

  /* ---------- MAIN SCREEN ---------- */
  #stage{position:relative; width:min(90vw,320px); height:280px; display:flex; align-items:center; justify-content:center; z-index:1;}
  .creature{width:100%; height:100%; overflow:visible;}

  .aura{fill:var(--body2); opacity:0.2; filter:blur(20px);}
  .creature.has-aura .aura{opacity:0.45; animation:auraPulse 3s ease-in-out infinite;}
  @keyframes auraPulse{0%,100%{opacity:0.3; r:90px;}50%{opacity:0.5; r:98px;}}

  .ground-shadow{fill:#000; opacity:0.09;}

  .ambient-twinkle polygon{animation:twinkle 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
  .ambient-twinkle polygon:nth-child(2){animation-delay:1.1s;}
  @keyframes twinkle{0%,100%{opacity:0.12; transform:scale(0.65);}50%{opacity:0.6; transform:scale(1);}}

  /* growth stage scaling, kept separate from mood/bounce animation transforms */
  #stageScale{transform-origin:100px 118px; transition:transform 0.6s ease;}
  .creature.stage-baby #stageScale{transform:scale(0.76);}
  .creature.stage-kid #stageScale{transform:scale(0.9);}
  .creature.stage-adult #stageScale{transform:scale(1);}
  .creature.grow-flash #stageScale{animation:growFlash 0.9s ease;}
  @keyframes growFlash{0%{filter:brightness(1) saturate(1);}40%{filter:brightness(1.35) saturate(1.4);}100%{filter:brightness(1) saturate(1);}}

  .body-shape{display:none; fill:url(#bodyGrad); stroke:var(--ink); stroke-width:4.5; stroke-opacity:0.8; stroke-linejoin:round;}
  .creature.species-drop .body-drop{display:block;}
  .creature.species-spike .body-spike{display:block;}
  .creature.species-cloud .body-cloud{display:block;}
  .creature.species-leaf .body-leaf{display:block;}
  .creature.species-flame .body-flame{display:block;}
  .creature.species-crystal .body-crystal{display:block; stroke:white; stroke-width:1.5; stroke-opacity:0.5;}
  .creature.species-blot .body-blot{display:block;}
  .creature.species-star .body-star{display:block;}
  .creature.species-rainbow .body-rainbow{display:block; fill:url(#rainbowGrad); stroke:white; stroke-width:1.5; stroke-opacity:0.5; animation:hueShift 4s linear infinite;}
  @keyframes hueShift{to{filter:hue-rotate(360deg);}}
  .gloss{fill:white; opacity:0.4;}
  .gloss-dot{fill:white; opacity:0.55;}
  .body-shadow{fill:#000; opacity:0.12;}
  .blush{fill:#ff8fa3; opacity:0.5;}
  .creature.species-crystal .gloss, .creature.species-rainbow .gloss,
  .creature.species-crystal .gloss-dot, .creature.species-rainbow .gloss-dot{display:none;}

  .deco{display:none;}
  .creature.species-blot .deco-blot{display:block;}

  .face{display:none;}
  .creature.mood-happy .face-happy{display:block;}
  .creature.mood-sad .face-sad{display:block;}
  .creature.mood-sleepy .face-sleepy{display:block;}
  .creature.mood-playful .face-playful{display:block;}
  .creature.mood-ecstatic .face-ecstatic{display:block;}
  .creature.mood-gloomy .face-gloomy{display:block;}
  .creature.mood-hungry .face-hungry{display:block;}
  .creature.mood-bored .face-bored{display:block;}
  .creature.mood-dizzy .face-dizzy{display:block;}

  .scar{display:none;}
  .creature.has-scar .scar{display:block;}
  .accessory{display:none;}
  .creature.has-accessory .accessory{display:block;}

  .zzz{animation:floatUp 2.4s ease-in-out infinite;}
  .zzz.z2{animation-delay:0.5s;}
  .zzz.z3{animation-delay:1s;}
  @keyframes floatUp{0%{opacity:0; transform:translateY(6px)}30%{opacity:0.8}100%{opacity:0; transform:translateY(-14px)}}

  .sparkle{animation:sparkle 1.4s ease-in-out infinite;}
  @keyframes sparkle{0%,100%{opacity:0.4; transform:scale(0.8)}50%{opacity:1; transform:scale(1.15)}}

  .spiral-eye{animation:spin 0.85s linear infinite; transform-box:fill-box; transform-origin:center;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .creature.bounce #bodyGroup{animation:bounce 0.7s ease;}
  @keyframes bounce{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-18px) scale(1.05,0.95)}55%{transform:translateY(0) scale(0.96,1.06)}100%{transform:translateY(0) scale(1,1)}}
  .creature.mood-ecstatic #bodyGroup{animation:bobble 1.1s ease-in-out infinite;}
  @keyframes bobble{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .creature.mood-sad #bodyGroup{transform:scaleY(0.92) translateY(6px);}
  .creature.mood-gloomy #bodyGroup{transform:scaleY(0.85) translateY(10px); opacity:0.75;}
  .creature.mood-bored #bodyGroup{transform:scaleY(0.95) translateY(3px);}
  .creature.mood-playful #bodyGroup{animation:tilt 1.8s ease-in-out infinite;}
  .creature.mood-dizzy #bodyGroup{animation:wobble 0.5s ease-in-out infinite;}
  @keyframes tilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes wobble{0%,100%{transform:rotate(-6deg) translateX(-3px)}50%{transform:rotate(6deg) translateX(3px)}}
  .creature:not(.bounce) #bodyGroup{animation-fill-mode:both;}
  #bodyGroup{transform-origin:100px 118px; animation:idle 3.4s ease-in-out infinite;}
  @keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

  /* poop / mess mechanic */
  .poop{display:none; cursor:pointer;}
  .creature.has-poop .poop{display:block;}
  .poop-inner{animation:poopPop 0.35s ease;}
  @keyframes poopPop{from{transform:scale(0) rotate(-10deg);}to{transform:scale(1) rotate(0);}}
  .poop-inner.cleaning{animation:poopClean 0.3s ease forwards;}
  @keyframes poopClean{to{transform:scale(0) rotate(25deg); opacity:0;}}

  /* per-action micro effects — nested wrapper so the CSS-animated transform never clobbers
     the outer element's position-setting transform attribute (they're different elements) */
  .fx{display:none; pointer-events:none;}
  .creature.fx-play-a .fx-play-a-el{display:block;}
  .creature.fx-play-a .fx-play-a-el .fx-inner{animation:fxBall 0.9s ease forwards;}
  .creature.fx-play-b .fx-play-b-el{display:block;}
  .creature.fx-play-b .fx-play-b-el .fx-inner{animation:fxStar 0.9s ease forwards;}
  .creature.fx-pet-a .fx-pet-a-el{display:block;}
  .creature.fx-pet-a .fx-pet-a-el .fx-inner{animation:fxHearts 0.9s ease forwards;}
  .creature.fx-pet-b .fx-pet-b-el{display:block;}
  .creature.fx-pet-b .fx-pet-b-el .fx-inner{animation:fxRing 0.9s ease forwards;}
  @keyframes fxBall{0%{opacity:0; transform:translate(0,0) scale(0.6);}20%{opacity:1;}50%{transform:translate(-8px,-20px) scale(1);}75%{transform:translate(8px,-6px) scale(0.95);}100%{opacity:0; transform:translate(0,6px) scale(0.7);}}
  @keyframes fxStar{0%{opacity:0; transform:translate(-36px,4px) rotate(0) scale(0.6);}30%{opacity:1;}100%{opacity:0; transform:translate(36px,-14px) rotate(220deg) scale(1);}}
  @keyframes fxHearts{0%{opacity:0; transform:translateY(4px) scale(0.5);}30%{opacity:1;}100%{opacity:0; transform:translateY(-30px) scale(1.05);}}
  @keyframes fxRing{0%{opacity:0.9; transform:scale(0.4);}100%{opacity:0; transform:scale(2.1);}}

  /* real feeding sequence: food travels up from below to the mouth, then gets eaten */
  .feed-item{display:none;}
  .feed-item.show-item{display:block;}
  .feed-travel{opacity:0;}
  .chomp{opacity:0; fill:var(--ink);}
  .creature.feeding .feed-travel{animation:feedTravel 0.62s cubic-bezier(.2,.7,.3,1) forwards;}
  .creature.feeding .chomp{animation:chompFlash 0.62s ease-out forwards;}
  @keyframes feedTravel{
    0%{opacity:0; transform:translate(0,74px) scale(0.65);}
    18%{opacity:1;}
    68%{opacity:1; transform:translate(0,0) scale(1);}
    82%{opacity:1; transform:translate(0,-3px) scale(1.15);}
    100%{opacity:0; transform:translate(0,-3px) scale(0.15);}
  }
  @keyframes chompFlash{
    0%,52%{opacity:0; transform:scale(0.3);}
    64%{opacity:1; transform:scale(1);}
    80%{opacity:1; transform:scale(0.8);}
    100%{opacity:0; transform:scale(0.3);}
  }
  @keyframes fxRing{0%{opacity:0.9; transform:scale(0.4);}100%{opacity:0; transform:scale(2.1);}}

  .creature.fx-jackpot .fx-jackpot-el{display:block;}
  .fx-jackpot-el .confetti{opacity:0;}
  .fx-jackpot-el .c1{animation:confettiBurst1 1s ease-out forwards;}
  .fx-jackpot-el .c2{animation:confettiBurst2 1s ease-out forwards;}
  .fx-jackpot-el .c3{animation:confettiBurst3 1s ease-out forwards;}
  .fx-jackpot-el .c4{animation:confettiBurst4 1s ease-out forwards;}
  .fx-jackpot-el .c5{animation:confettiBurst5 1s ease-out forwards;}
  .fx-jackpot-el .c6{animation:confettiBurst6 1s ease-out forwards;}
  @keyframes confettiBurst1{0%{opacity:0; transform:translate(0,0) scale(0.4);}20%{opacity:1;}100%{opacity:0; transform:translate(-42px,-32px) scale(1) rotate(180deg);}}
  @keyframes confettiBurst2{0%{opacity:0; transform:translate(0,0) scale(0.4);}20%{opacity:1;}100%{opacity:0; transform:translate(2px,-48px) scale(1) rotate(-160deg);}}
  @keyframes confettiBurst3{0%{opacity:0; transform:translate(0,0) scale(0.4);}20%{opacity:1;}100%{opacity:0; transform:translate(42px,-30px) scale(1) rotate(200deg);}}
  @keyframes confettiBurst4{0%{opacity:0; transform:translate(0,0) scale(0.4);}20%{opacity:1;}100%{opacity:0; transform:translate(-36px,14px) scale(1) rotate(-140deg);}}
  @keyframes confettiBurst5{0%{opacity:0; transform:translate(0,0) scale(0.4);}20%{opacity:1;}100%{opacity:0; transform:translate(2px,30px) scale(1) rotate(160deg);}}
  @keyframes confettiBurst6{0%{opacity:0; transform:translate(0,0) scale(0.4);}20%{opacity:1;}100%{opacity:0; transform:translate(36px,14px) scale(1) rotate(-200deg);}}

  /* speech bubble */
  #bubbleWrap{
    min-height:70px; display:flex; align-items:flex-start; justify-content:center;
    width:min(90vw,320px); margin-top:2px; z-index:1;
  }
  #bubble{
    background:white; color:#2c3a36; padding:13px 20px; border-radius:20px;
    font-size:14px; font-weight:600; max-width:280px; text-align:center; line-height:1.35;
    box-shadow:0 10px 22px rgba(0,0,0,0.10);
    border:2.5px solid var(--body2);
    opacity:0; transform:translateY(-6px) scale(0.95);
    transition:opacity 0.25s, transform 0.25s, border-color 0.4s;
  }
  #bubble.show{opacity:1; transform:translateY(0) scale(1);}

  #label{margin-top:2px; font-size:13px; opacity:0.5; font-weight:600; letter-spacing:0.02em; z-index:1;}

  #buttons{
    position:fixed; left:0; right:0; bottom:0; z-index:5;
    padding:0 24px calc(20px + env(safe-area-inset-bottom)) 24px;
    display:flex; justify-content:center; gap:22px;
  }
  .btn-wrap{display:flex; flex-direction:column; align-items:center; gap:7px;}
  .btn{
    width:64px; height:64px; border-radius:50%; border:3px solid var(--body2);
    background:white; color:#2c3a36; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px rgba(0,0,0,0.12);
    transition:transform 0.15s, border-color 0.4s;
  }
  .btn:active{transform:scale(0.88);}
  .btn svg{width:26px; height:26px;}
  .btn-label{font-size:11px; font-weight:800; letter-spacing:0.02em; color:#2c3a36; opacity:0.75; background:rgba(255,255,255,0.85); padding:2px 8px; border-radius:8px;}
</style>
</head>
<body>

<div id="ambient"><span></span><span></span><span></span><span></span><span></span><div class="cloud c1"></div><div class="cloud c2"></div></div>
<div id="ground"></div>

<button id="header" type="button">БУЛЬК</button>
<div id="rosterStrip"></div>

<div id="hatch">
  <div id="eggWrap">
    <svg id="egg" viewBox="0 0 140 170">
      <ellipse cx="70" cy="90" rx="60" ry="75" fill="#e4e0f5"/>
      <ellipse cx="52" cy="60" rx="16" ry="22" fill="white" opacity="0.4"/>
    </svg>
    <h1>Кто-то там шевелится</h1>
    <p>Тапни по яйцу, чтобы узнать, кто у тебя вылупился</p>
  </div>
  <div id="hatchReveal">
    <div id="hatchCreatureWrap"></div>
    <div id="hatchName"></div>
    <button id="hatchBtn">Продолжить</button>
  </div>
</div>

<div id="menuOverlay" class="overlay">
  <div class="menu-card">
    <button class="menu-row" id="menuRename">✏️&nbsp;&nbsp;Переименовать</button>
    <button class="menu-row" id="menuCollection">📚&nbsp;&nbsp;Коллекция</button>
    <button class="menu-row" id="menuSound">🔊&nbsp;&nbsp;<span id="menuSoundLabel">Звук: вкл</span></button>

  const seqCombo = [];

  /* ---------- sound engine (tiny Web Audio synth, no assets) ---------- */
  let actx = null;
  function ctx(){
    if(!actx){
      try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    }
    if(actx.state==='suspended') actx.resume().catch(()=>{});
    return actx;
  }
  function beep(freq, dur, delay, type, gain){
    if(!settings.sound) return;
    const c = ctx();
    if(!c) return;
    try{
      const t0 = c.currentTime + (delay||0);
      const osc = c.createOscillator();
      const g = c.createGain();
      osc.type = type||'sine';
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(gain||0.12, t0+0.015);
      g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
      osc.connect(g).connect(c.destination);
      osc.start(t0);
      osc.stop(t0+dur+0.02);
    }catch(e){}
  }
  function playSound(kind){
    if(!settings.sound) return;
    if(kind==='feed'){ beep(520,0.11,0,'sine'); beep(680,0.12,0.09,'sine'); }
    else if(kind==='play'){ beep(720,0.08,0,'triangle'); }
    else if(kind==='pet'){ beep(440,0.16,0,'sine',0.09); }
    else if(kind==='clean'){ beep(360,0.09,0,'square',0.06); }
    else if(kind==='growth'){ beep(392,0.1,0,'sine'); beep(523,0.14,0.09,'sine'); }
    else if(kind==='idle'){ beep(330,0.09,0,'sine',0.05); }
    else if(kind==='hatch'){ beep(523,0.1,0,'sine'); beep(659,0.1,0.1,'sine'); beep(784,0.16,0.2,'sine'); }
    else if(kind==='jackpot'){ [523,659,784,1046].forEach((f,i)=>beep(f,0.14,i*0.08,'triangle',0.1)); }
    else if(kind==='overload'){ [300,260,220].forEach((f,i)=>beep(f,0.14,i*0.09,'sawtooth',0.07)); }
    else if(kind==='combo'){ [523,659,784,1046,1318].forEach((f,i)=>beep(f,0.12,i*0.06,'triangle',0.1)); }
  }
  function vibrate(pattern){
    try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
  }

  function createNewPet(){
    const sp = weightedPick(SPECIES);
    const tr = pick(TRAITS);
    const now = Date.now();
    return {
      id: makeId(),
      species: sp.id, trait: tr.id, nickname: null,
      createdAt: now, lastInteraction: now,
      lastFed: now, lastPlayed: now, feedCount: 0, nextPoopAt: null,
      lastStageSeen: 'baby',
      totalInteractions: 0, neglectCount: 0,
      lastOpenDate: todayStr(), streakDays: 1,
      auraUnlocked:false, scarUnlocked:false, accessoryUnlocked:false
    };
  }

  function applyPalette(sp){
    const r = document.documentElement.style;
    r.setProperty('--body1', sp.colors[0]);
    r.setProperty('--body2', sp.colors[1]);
    r.setProperty('--bg1', sp.bg[0]);
    r.setProperty('--bg2', sp.bg[1]);
    r.setProperty('--ink', sp.dark ? '#f2eefb' : '#2c3a36');
  }

  function computeStats(s){
    const now = Date.now();
    const hoursSinceFed = (now-(s.lastFed||s.createdAt))/3600000;
    const hoursSincePlayed = (now-(s.lastPlayed||s.createdAt))/3600000;
    return {
      hunger: Math.max(0, 100 - hoursSinceFed*2.2),
      fun: Math.max(0, 100 - hoursSincePlayed*2.8)
    };
  }

  function stageOf(s){
    const days = (Date.now()-s.createdAt)/86400000;
    if(days<1) return 'baby';
    if(days<5) return 'kid';
    return 'adult';
  }

  function computeMood(s, isFirstPaintReunion){
    if(isFirstPaintReunion) return 'ecstatic';
    const now = Date.now();
    const {hunger, fun} = computeStats(s);
    const hoursSinceAny = (now-s.lastInteraction)/3600000;
    const h = new Date().getHours();
    const night = (h>=23 || h<7);
    if(hoursSinceAny>72 || (hunger<12 && fun<12)) return 'gloomy';
    if(hoursSinceAny>24) return 'sad';
    if(hunger<30) return 'hungry';
    if(fun<30) return 'bored';
    if(night) return 'sleepy';
    return 'happy';
  }

  function updateCosmetics(s, poopVisible){
    const c = document.getElementById('creature');
    c.classList.toggle('has-aura', s.auraUnlocked);
    c.classList.toggle('has-scar', s.scarUnlocked);
    c.classList.toggle('has-accessory', s.accessoryUnlocked);
    c.classList.toggle('has-poop', poopVisible);
  }

  function render(mood){
    const creature = document.getElementById('creature');
    const stage = stageOf(state);
    creature.setAttribute('class', 'creature species-' + state.species + ' mood-' + mood + ' stage-' + stage);
    const poopVisible = !!(state.nextPoopAt && Date.now() >= state.nextPoopAt);
    updateCosmetics(state, poopVisible);
    const sp = speciesById(state.species);
    const tr = traitById(state.trait);
    const label = state.nickname ? (state.nickname + ' · ' + sp.name + ' · ' + tr.name) : (sp.name + ' · ' + tr.name);
    document.getElementById('label').textContent = label;
  }

  function showBubble(text){
    const b = document.getElementById('bubble');
    b.textContent = text;
    b.classList.add('show');
    clearTimeout(showBubble._t);
    showBubble._t = setTimeout(()=>b.classList.remove('show'), 2600);
  }

  function bounce(){
    const c = document.getElementById('creature');
    c.classList.remove('bounce'); void c.offsetWidth;
    c.classList.add('bounce');
  }

  function playEffect(kind){
    const c = document.getElementById('creature');
    const variant = Math.random()<0.5 ? 'a' : 'b';
    const cls = 'fx-' + kind + '-' + variant;
    c.classList.remove(cls); void c.offsetWidth;
    c.classList.add(cls);
    setTimeout(()=>c.classList.remove(cls), 900);
  }

  function playJackpot(){
    const c = document.getElementById('creature');
    c.classList.remove('fx-jackpot'); void c.offsetWidth;
    c.classList.add('fx-jackpot');
    setTimeout(()=>c.classList.remove('fx-jackpot'), 1000);
  }

  function checkGrowth(){
    const s = stageOf(state);
    if(s !== state.lastStageSeen){
      state.lastStageSeen = s;
      saveRoster();
      showBubble(pick(LINES.growth));
      playSound('growth');
      const c = document.getElementById('creature');
      c.classList.remove('grow-flash'); void c.offsetWidth;
      c.classList.add('grow-flash');
      setTimeout(()=>c.classList.remove('grow-flash'), 900);
    }
  }

  function cleanPoop(){
    if(!state || !state.nextPoopAt) return;
    const inner = document.querySelector('.poop-inner');
    if(inner) inner.classList.add('cleaning');
    state.nextPoopAt = null;
    saveRoster();
    showBubble(pick(LINES.clean));
    playSound('clean');
    vibrate(10);
    setTimeout(()=>render(computeMood(state,false)), 320);
  }

  function idleFlourish(){
    bounce();
    showBubble(pick(LINES.idle));
    playSound('idle');
  }

  function interact(kind){
    if(!state) return;
    const now = Date.now();
    state.totalInteractions++;
    state.lastInteraction = now;
    if(kind==='feed'){
      state.lastFed = now;
      state.feedCount = (state.feedCount||0)+1;
      if(state.feedCount % 3 === 0 && !state.nextPoopAt){
        state.nextPoopAt = now + (2 + Math.random()*4)*3600000;
      }
    }
    if(kind==='play') state.lastPlayed = now;
    if(state.totalInteractions>=30) state.auraUnlocked = true;
    if(state.streakDays>=5) state.accessoryUnlocked = true;
    saveRoster();

    // rapid-tap tracking (session-only) — spam the same button and the pet notices
    if(kind===combo.kind && now-combo.time<1300){ combo.count++; } else { combo.count=1; }
    combo.kind = kind; combo.time = now;

    // secret sequence: feed -> play -> pet within 6s
    seqCombo.push({kind, time: now});
    if(seqCombo.length>3) seqCombo.shift();
    const isCombo = seqCombo.length===3 &&
      seqCombo[0].kind==='feed' && seqCombo[1].kind==='play' && seqCombo[2].kind==='pet' &&
      (seqCombo[2].time - seqCombo[0].time) < 6000;
    if(isCombo) seqCombo.length = 0;

    const isOverload = !isCombo && combo.count>=4;
    const isJackpot = !isCombo && !isOverload && Math.random()<0.1;

    let mood, line, soundKind;
    if(isCombo){
      mood = 'ecstatic'; line = pick(LINES.combo); soundKind = 'combo';
    } else if(isOverload){
      mood = 'dizzy'; line = pick(LINES.overload[kind]); soundKind = 'overload';
    } else if(isJackpot){
      mood = 'ecstatic'; line = pick(LINES.jackpot); soundKind = 'jackpot';
    } else {
      mood = state.totalInteractions % 4 === 0 ? 'ecstatic' : 'playful';
      line = pick(LINES[kind]); soundKind = kind;
    }

    render(mood);
    bounce();
    playEffect(kind);
    if(isJackpot || isCombo) playJackpot();
    showBubble(line);
    playSound(soundKind);
    if(isCombo) vibrate([10,30,10,30,10]);
    else if(isOverload) vibrate([15,30,15,30]);
    else if(isJackpot) vibrate([10,20,10,20,10]);
    else vibrate(12);
    clearTimeout(interact._t);
    interact._t = setTimeout(()=>render(computeMood(state,false)), isOverload?2600:2200);
  }

  function tick(){
    if(reunion || !state) return;
    render(computeMood(state,false));
    checkGrowth();
    if(Math.random()<0.35) idleFlourish();
  }

  /* ---------- header menu ---------- */
  function openMenu(){
    if(!state) return;
    document.getElementById('menuSoundLabel').textContent = 'Звук: ' + (settings.sound ? 'вкл' : 'выкл');
    document.getElementById('menuOverlay').classList.add('show');
  }
  function closeMenu(){
    document.getElementById('menuOverlay').classList.remove('show');
  }
  function renamePet(){
    closeMenu();
    const name = window.prompt('Как назовём питомца?', state.nickname || '');
    if(name===null) return;
    const trimmed = name.trim().slice(0,18);
    state.nickname = trimmed || null;
    saveRoster();
    render(computeMood(state,false));
    renderRosterStrip();
  }
  function toggleSound(){
    settings.sound = !settings.sound;
    saveSettings(settings);
    document.getElementById('menuSoundLabel').textContent = 'Звук: ' + (settings.sound ? 'вкл' : 'выкл');
    if(settings.sound) beep(600,0.08,0,'sine',0.08);
  }

  /* ---------- collection ---------- */
  function openCollection(){
    closeMenu();
    const listEl = document.getElementById('collectionList');
    let collection = [];
    try{ collection = JSON.parse(localStorage.getItem(COLLECTION_KEY) || '[]'); }catch(e){}
    if(!collection.length){
      listEl.innerHTML = '<div class="collection-empty">Пока никого не отпускал(а).<br>Текущие питомцы тоже когда-нибудь тут появятся.</div>';
    } else {
      const fmt = d => new Date(d).toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
      listEl.innerHTML = collection.slice().reverse().map(item=>{
        const sp = speciesById(item.species);
        const tr = traitById(item.trait);
        const name = item.nickname ? (item.nickname + ' — ' + sp.name) : sp.name;
        const grad = sp.id==='rainbow' ? 'linear-gradient(135deg,#ff8fa3,#ffd15c,#8fe8cf,#5cb3ff,#b89aff)' : ('linear-gradient(135deg,'+sp.colors[0]+','+sp.colors[1]+')');
        return '<div class="collection-item">' +
          '<div class="collection-dot" style="background:' + grad + '"></div>' +
          '<div class="collection-info"><div class="collection-name">' + name + ' · ' + tr.name + '</div>' +
          '<div class="collection-dates">' + fmt(item.hatchedAt) + ' — ' + fmt(item.releasedAt) + '</div></div>' +
          '</div>';
      }).join('');
    }
    document.getElementById('collectionOverlay').classList.add('show');
  }
  function closeCollection(){
    document.getElementById('collectionOverlay').classList.remove('show');
  }

  /* ---------- roster strip (multiple pets at once) ---------- */
  function renderRosterStrip(){
    const el = document.getElementById('rosterStrip');
    if(!roster.length){ el.innerHTML=''; el.style.display='none'; return; }
    el.style.display = 'flex';
    let html = roster.map(p=>{
      const sp = speciesById(p.species);
      const grad = sp.id==='rainbow' ? 'linear-gradient(135deg,#ff8fa3,#ffd15c,#8fe8cf,#5cb3ff,#b89aff)' : ('linear-gradient(135deg,'+sp.colors[0]+','+sp.colors[1]+')');
      const activeCls = p.id===activeId ? ' active' : '';
      return '<button class="roster-dot' + activeCls + '" style="background:' + grad + '" data-id="' + p.id + '" title="' + (p.nickname||sp.name) + '"></button>';
    }).join('');
    if(roster.length < MAX_ROSTER) html += '<button class="roster-add" id="rosterAddBtn" type="button">+</button>';
    el.innerHTML = html;
    el.querySelectorAll('.roster-dot').forEach(btn=>{
      btn.addEventListener('click', ()=>switchActive(btn.getAttribute('data-id')));
    });
    const addBtn = document.getElementById('rosterAddBtn');
    if(addBtn) addBtn.addEventListener('click', requestNewPet);
  }

  function switchActive(id){
    if(id===activeId) return;
    const next = roster.find(p=>p.id===id);
    if(!next) return;
    activeId = id;
    saveActiveId();
    state = next;
    applyPalette(speciesById(state.species));
    reunion = false;
    render(computeMood(state,false));
    renderRosterStrip();
  }

  function requestNewPet(){
    if(roster.length>=MAX_ROSTER){
      window.alert('Максимум ' + MAX_ROSTER + ' питомцев одновременно. Сначала отпусти кого-нибудь.');
      return;
    }
    openHatch();
  }

  /* ---------- release / change pet ---------- */
  function openResetConfirm(){
    closeMenu();
    if(!state) return;
    const sp = speciesById(state.species), tr = traitById(state.trait);
    const name = state.nickname ? ('«' + state.nickname + '» (' + sp.name.toLowerCase() + ')') : ('«' + sp.name + '»');
    document.getElementById('resetText').textContent =
      'Отпустить ' + name + ' (' + tr.name.toLowerCase() + ') и вылупить нового?';
    document.getElementById('resetOverlay').classList.add('show');
  }
  function closeResetConfirm(){
    document.getElementById('resetOverlay').classList.remove('show');
  }
  function releasePet(){
    try{
      const collection = JSON.parse(localStorage.getItem(COLLECTION_KEY) || '[]');
      collection.push({species: state.species, trait: state.trait, nickname: state.nickname||null, hatchedAt: state.createdAt, releasedAt: Date.now()});
      localStorage.setItem(COLLECTION_KEY, JSON.stringify(collection));
    }catch(e){}
    const idx = roster.findIndex(p=>p.id===activeId);
    if(idx>-1) roster.splice(idx,1);
    saveRoster();
    localStorage.removeItem(ACTIVE_KEY);
    location.reload();
  }

  /* ---------- hatch flow (works both first-time and for "+" additions) ---------- */
  function openHatch(){
    document.getElementById('hatch').classList.remove('hidden');
    document.getElementById('eggWrap').style.display = '';
    document.getElementById('egg').classList.remove('cracking');
    document.getElementById('hatchReveal').classList.remove('show');
    document.getElementById('hatchCreatureWrap').innerHTML = '';
    cracking = false;
  }

  function crackEgg(){
    if(cracking) return;
    cracking = true;
    document.getElementById('egg').classList.add('cracking');
    setTimeout(()=>{
      const pet = createNewPet();
      roster.push(pet);
      state = pet;
      activeId = pet.id;
      saveRoster();
      saveActiveId();
      document.getElementById('eggWrap').style.display = 'none';
      applyPalette(speciesById(pet.species));
      buildHatchPreview();
      document.getElementById('hatchReveal').classList.add('show');
      playSound('hatch');
      const sp = speciesById(pet.species), tr = traitById(pet.trait);
      document.getElementById('hatchName').textContent =
        'Это ' + tr.name.toLowerCase() + ' по имени «' + sp.name + '»' + (sp.rare ? ' ✨ Редкий вид!' : '');
      cracking = false;
    }, 1500);
  }

  function buildHatchPreview(){
    const wrap = document.getElementById('hatchCreatureWrap');
    const clone = document.getElementById('creature').cloneNode(true);
    clone.removeAttribute('id');
    const dupDefs = clone.querySelector('defs');
    if(dupDefs) dupDefs.remove();
    clone.style.width='100%'; clone.style.height='100%';
    clone.setAttribute('class', 'creature species-'+state.species+' mood-ecstatic stage-baby');
    wrap.appendChild(clone);
  }

  function showMain(wasGone){
    document.getElementById('hatch').classList.add('hidden');
    applyPalette(speciesById(state.species));
    reunion = !!wasGone;
    render(reunion ? 'ecstatic' : computeMood(state,false));
    if(reunion) showBubble(pick(LINES.reunion));
    setTimeout(()=>{ reunion=false; render(computeMood(state,false)); checkGrowth(); }, reunion?3200:0);
    if(!tickStarted){ setInterval(tick, 60000); tickStarted = true; }
  }

  function bindListeners(){
    document.getElementById('header').addEventListener('click', openMenu);
    document.getElementById('menuCancel').addEventListener('click', closeMenu);
    document.getElementById('menuRename').addEventListener('click', renamePet);
    document.getElementById('menuCollection').addEventListener('click', openCollection);
    document.getElementById('menuSound').addEventListener('click', toggleSound);
    document.getElementById('menuRelease').addEventListener('click', openResetConfirm);
    document.getElementById('resetCancel').addEventListener('click', closeResetConfirm);
    document.getElementById('resetConfirmBtn').addEventListener('click', releasePet);
    document.getElementById('collectionClose').addEventListener('click', closeCollection);
    document.getElementById('egg').addEventListener('click', crackEgg);
    document.getElementById('hatchBtn').addEventListener('click', function(){ showMain(false); renderRosterStrip(); });
    document.getElementById('btnFeed').addEventListener('click', ()=>interact('feed'));
    document.getElementById('btnPlay').addEventListener('click', ()=>interact('play'));
    document.getElementById('btnPet').addEventListener('click', ()=>interact('pet'));
    document.querySelector('.poop').addEventListener('click', cleanPoop);
  }

  function boot(){
    bindListeners();

    if(!roster.length){
      openHatch();
      return;
    }

    if(!state.lastFed) state.lastFed = state.createdAt;
    if(!state.lastPlayed) state.lastPlayed = state.createdAt;
    if(!state.lastStageSeen) state.lastStageSeen = stageOf(state);
    if(state.nickname===undefined) state.nickname = null;

    const wasGone = (Date.now()-state.lastInteraction)/3600000 > 20;
    const today = todayStr();
    if(state.lastOpenDate !== today){
      const yest = new Date(Date.now()-86400000).toISOString().slice(0,10);
      state.streakDays = (state.lastOpenDate===yest) ? state.streakDays+1 : 1;
      state.lastOpenDate = today;
    }
    if(wasGone) state.neglectCount++;
    if(state.neglectCount>=2) state.scarUnlocked = true;
    saveActiveId();
    saveRoster();
    showMain(wasGone);
    renderRosterStrip();
  }

  boot();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
